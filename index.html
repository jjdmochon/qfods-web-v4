                <div class="dialog-body">
                  ${questions.length === 0 ? `
                    <div style="padding: 24px; text-align: center; color: var(--color-text-muted);">
                      No hay preguntas de test disponibles para este tema introductorio.
                    </div>
                  ` : `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                      <span class="tag tag-accent">PREGUNTA ${state.activeQuizIndex + 1} DE ${questions.length}</span>
                      <span class="tag tag-outline">${currQ.block || 'Farmacología'}</span>
                    </div>

                    <h3 style="font-size: 1.15rem; margin-bottom: 16px;">${currQ.question}</h3>

                    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                      ${currQ.options.map((opt, oIdx) => {
                        const optText = typeof opt === 'string' ? opt : opt.text;
                        const isSelected = state.quizAnswers[state.activeQuizIndex] === oIdx;
                        return `
                          <label style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 2px solid var(--color-border); cursor: pointer; background: ${isSelected ? 'var(--color-surface-dim)' : '#ffffff'};">
                            <input type="radio" name="quiz-opt" value="${oIdx}" ${isSelected ? 'checked' : ''} style="width: 18px; height: 18px; accent-color: var(--color-accent);" />
                            <span style="font-size: 0.92rem;">${optText}</span>
                          </label>
                        `;
                      }).join('')}
                    </div>

                    ${state.quizSubmitted ? `
                      <div style="background: var(--color-bg); padding: 14px; border-left: 4px solid var(--color-accent); font-size: 0.88rem;">
                        <strong>Solución oficial:</strong> Opción ${currQ.correctIndex + 1}<br />
                        ${currQ.explanation}
                      </div>
                    ` : ''}
                  `}
                </div>
                <div class="dialog-footer">
                  <div style="display: flex; justify-content: space-between; width: 100%;">
                    <button class="btn btn-secondary btn-sm" id="btn-quiz-prev" ${state.activeQuizIndex === 0 ? 'disabled' : ''}>← ANTERIOR</button>
                    <div style="display: flex; gap: 8px;">
                      ${!state.quizSubmitted ? `
                        <button class="btn btn-primary btn-sm" id="btn-quiz-check">COMPROBAR</button>
                      ` : `
                        <button class="btn btn-secondary btn-sm" id="btn-quiz-reset">REINTENTAR</button>
                      `}
                      <button class="btn btn-secondary btn-sm" id="btn-quiz-next" ${state.activeQuizIndex === questions.length - 1 ? 'disabled' : ''}>SIGUIENTE →</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;

        // --------------------------------------------------------------------
        // MODAL 5: FLASHCARDS INTERACTIVAS DE REPASO
        // --------------------------------------------------------------------
        case 'flashcards':
          const fcTopic = TOPICS.find(t => t.id === state.selectedTopicId) || TOPICS[1];
          const cards = fcTopic.flashcards || [];
          const currCard = cards[state.activeFlashcardIndex];

          return `
            <div class="dialog-backdrop" id="modal-backdrop">
              <div class="dialog">
                <div class="dialog-header">
                  <h3>FLASHCARDS DE REPASO · ${fcTopic.number}</h3>
                  <button class="btn btn-ghost btn-sm" id="btn-close-modal">✕</button>
                </div>
                <div class="dialog-body">
                  ${cards.length === 0 ? `
                    <div style="padding: 24px; text-align: center; color: var(--color-text-muted);">
                      No hay flashcards para este tema.
                    </div>
                  ` : `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                      <span class="tag tag-accent">TARJETA ${state.activeFlashcardIndex + 1} DE ${cards.length}</span>
                      <span class="tag tag-outline">${currCard.concept}</span>
                    </div>

                    <!-- Tarjeta interactiva con giro -->
                    <div id="flashcard-box" style="border: 2px solid var(--color-border); background: #ffffff; min-height: 220px; padding: 32px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; margin-bottom: 20px;">
                      <div class="kicker" style="margin-bottom: 8px;">
                        ${state.flashcardFlipped ? 'REVERSO (RESPUESTA & MECANISMO)' : 'ANVERSO (PREGUNTA / CONCEPTO)'}
                      </div>
                      <div style="font-size: 1.25rem; font-weight: 700; line-height: 1.4;">
                        ${state.flashcardFlipped ? currCard.back : currCard.front}
                      </div>
                      <div style="font-size: 0.75rem; color: var(--color-text-muted); margin-top: 16px;">
                        [HAZ CLIC PARA DAR LA VUELTA]
                      </div>
                    </div>
                  `}
                </div>
                <div class="dialog-footer">
                  <div style="display: flex; justify-content: space-between; width: 100%;">
                    <button class="btn btn-secondary btn-sm" id="btn-fc-prev" ${state.activeFlashcardIndex === 0 ? 'disabled' : ''}>← ANTERIOR</button>
                    <button class="btn btn-primary btn-sm" id="btn-fc-flip">VOLTEAR TARJETA</button>
                    <button class="btn btn-secondary btn-sm" id="btn-fc-next" ${state.activeFlashcardIndex === cards.length - 1 ? 'disabled' : ''}>SIGUIENTE →</button>
                  </div>
                </div>
              </div>
            </div>
          `;

        // --------------------------------------------------------------------
        // MODAL 6: SIMULADOR DE PREGUNTAS OFICIALES FIR
        // --------------------------------------------------------------------
        case 'fir':
          const firTopicId = state.modalData || state.selectedTopicId;
          const matchedFir = FIR_QUESTIONS.filter(q => !firTopicId || q.qfdosTopicId === firTopicId).slice(0, 10);

          return `
            <div class="dialog-backdrop" id="modal-backdrop">
              <div class="dialog" style="max-width: 860px;">
                <div class="dialog-header">
                  <h3>PREGUNTAS OFICIALES FIR (MINISTERIO DE SANIDAD)</h3>
                  <button class="btn btn-ghost btn-sm" id="btn-close-modal">✕</button>
                </div>
                <div class="dialog-body">
                  <div style="margin-bottom: 16px;">
                    <p style="font-size: 0.88rem; color: var(--color-text-secondary);">
                      Banco de preguntas oficiales de convocatorias FIR (2020-2025) vinculadas a este módulo temático.
                    </p>
                  </div>

                  <div style="display: flex; flex-direction: column; gap: 16px; max-height: 480px; overflow-y: auto;">
                    ${matchedFir.map((q, idx) => `
                      <div style="border: 2px solid var(--color-border); padding: 16px; background: #ffffff;">
                        <div style="display: flex; gap: 6px; margin-bottom: 6px;">
                          <span class="tag tag-accent">${q.badge}</span>
                          <span class="tag tag-outline">${q.block}</span>
                        </div>
                        <div style="font-weight: 800; font-size: 0.98rem; margin-bottom: 10px;">${q.question}</div>
                        <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px;">
                          ${q.options.map((opt, oIdx) => `
                            <div style="padding: 6px 10px; font-size: 0.85rem; border: 1px solid var(--color-border-subtle); background: ${oIdx === q.correctIndex ? '#dcfce7' : '#ffffff'};">
                              ${oIdx === q.correctIndex ? '<strong>✓ ' + opt + '</strong>' : opt}
                            </div>
                          `).join('')}
                        </div>
                        <div style="font-size: 0.8rem; color: var(--color-text-muted); background: var(--color-bg); padding: 8px 10px; border-left: 2px solid var(--color-border);">
                          ${q.explanation}
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>
          `;

        default:
          return '';
      }
    }

    // ========================================================================
    // GESTIÓN DE EVENTOS & INTERACTIVIDAD
    // ========================================================================
    function attachEventListeners() {
      // Login buttons
      const btnGoogle = document.getElementById('btn-login-google');
      if (btnGoogle) {
        btnGoogle.onclick = () => {
          state.user = { role: 'estudiante', name: 'Estudiante UGR', email: 'alumno@correo.ugr.es' };
          localStorage.setItem('qfdos_v4_user', JSON.stringify(state.user));
          state.screen = 'hub';
          render();
        };
      }

      const btnGuest = document.getElementById('btn-login-guest');
      if (btnGuest) {
        btnGuest.onclick = () => {
          state.user = { role: 'invitado', name: 'Usuario Invitado', email: 'invitado@ugr.es' };
          localStorage.setItem('qfdos_v4_user', JSON.stringify(state.user));
          state.screen = 'hub';
          render();
        };
      }

      const btnTeacher = document.getElementById('btn-login-teacher');
      if (btnTeacher) {
        btnTeacher.onclick = () => {
          state.user = { role: 'profesor', name: 'Dr. Juan José Díaz-Mochón', email: 'juandiaz@go.ugr.es' };
          localStorage.setItem('qfdos_v4_user', JSON.stringify(state.user));
          state.screen = 'hub';
          render();
        };
      }

      // Logout
      const btnLogout = document.getElementById('btn-logout');
      if (btnLogout) {
        btnLogout.onclick = () => {
          localStorage.removeItem('qfdos_v4_user');
          state.screen = 'login';
          render();
        };
      }

      // Brand link -> Hub
      const brandLink = document.getElementById('brand-link');
      if (brandLink) {
        brandLink.onclick = () => { state.screen = 'hub'; render(); };
      }

      // Navigation Links
      document.querySelectorAll('[data-nav]').forEach(el => {
        el.onclick = () => {
          state.screen = el.getAttribute('data-nav');
          window.scrollTo(0, 0);
          render();
        };
      });

      // Abrir detalle de tema
      document.querySelectorAll('[data-open-topic]').forEach(el => {
        el.onclick = () => {
          state.selectedTopicId = el.getAttribute('data-open-topic');
          state.screen = 'topic';
          window.scrollTo(0, 0);
          render();
        };
      });

      // Modales Triggers
      const btnSearch = document.getElementById('btn-trigger-search');
      if (btnSearch) btnSearch.onclick = () => { state.activeModal = 'search'; state.modalData = ''; render(); };

      const mobileSearch = document.getElementById('mobile-btn-search');
      if (mobileSearch) mobileSearch.onclick = () => { state.activeModal = 'search'; state.modalData = ''; render(); };

      const cardSearch = document.getElementById('card-quick-search');
      if (cardSearch) cardSearch.onclick = () => { state.activeModal = 'search'; state.modalData = ''; render(); };

      const btnPodcast = document.getElementById('btn-trigger-podcast');
      if (btnPodcast) btnPodcast.onclick = () => { state.activeModal = 'spotify'; render(); };

      const cardQuestion = document.getElementById('card-quick-question');
      if (cardQuestion) cardQuestion.onclick = () => { state.activeModal = 'question'; render(); };

      const btnHeroFir = document.getElementById('btn-hero-fir');
      if (btnHeroFir) btnHeroFir.onclick = () => { state.activeModal = 'fir'; state.modalData = null; render(); };

      // Cerrar modales
      const btnCloseModal = document.getElementById('btn-close-modal');
      if (btnCloseModal) btnCloseModal.onclick = () => { state.activeModal = null; render(); };

      const btnCloseFooter = document.getElementById('btn-close-modal-footer');
      if (btnCloseFooter) btnCloseFooter.onclick = () => { state.activeModal = null; render(); };

      const modalBackdrop = document.getElementById('modal-backdrop');
      if (modalBackdrop) {
        modalBackdrop.onclick = (e) => {
          if (e.target === modalBackdrop) {
            state.activeModal = null;
            render();
          }
        };
      }

      // Atajo de teclado ⌘K / Ctrl+K
      window.onkeydown = (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          state.activeModal = state.activeModal === 'search' ? null : 'search';
          state.modalData = '';
          render();
        } else if (e.key === 'Escape' && state.activeModal) {
          state.activeModal = null;
          render();
        }
      };

      // Búsqueda en modal
      const modalSearchInput = document.getElementById('modal-search-input');
      if (modalSearchInput) {
        modalSearchInput.oninput = (e) => {
          state.modalData = e.target.value;
          render();
          const newInput = document.getElementById('modal-search-input');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        };
      }

      // Navegar desde resultado de búsqueda
      document.querySelectorAll('[data-search-nav]').forEach(el => {
        el.onclick = () => {
          state.selectedTopicId = el.getAttribute('data-search-nav');
          state.screen = 'topic';
          state.activeModal = null;
          render();
        };
      });

      // Filtro de temario
      const temarioFilter = document.getElementById('input-temario-filter');
      if (temarioFilter) {
        temarioFilter.oninput = (e) => {
          state.searchTerm = e.target.value;
          render();
          const newF = document.getElementById('input-temario-filter');
          if (newF) {
            newF.focus();
            newF.setSelectionRange(newF.value.length, newF.value.length);
          }
        };
      }

      // Botones didácticos de Topic
      const btnTopicQuiz = document.getElementById('btn-topic-quiz');
      if (btnTopicQuiz) {
        btnTopicQuiz.onclick = () => {
          state.activeQuizIndex = 0;
          state.quizAnswers = {};
          state.quizSubmitted = false;
          state.activeModal = 'quiz';
          render();
        };
      }

      const btnTopicFlashcards = document.getElementById('btn-topic-flashcards');
      if (btnTopicFlashcards) {
        btnTopicFlashcards.onclick = () => {
          state.activeFlashcardIndex = 0;
          state.flashcardFlipped = false;
          state.activeModal = 'flashcards';
          render();
        };
      }

      const btnTopicFir = document.getElementById('btn-topic-fir');
      if (btnTopicFir) {
        btnTopicFir.onclick = () => {
          state.modalData = state.selectedTopicId;
          state.activeModal = 'fir';
          render();
        };
      }

      // Pestañas de Prácticas
      document.querySelectorAll('[data-ptab]').forEach(el => {
        el.onclick = () => {
          state.practicasTab = el.getAttribute('data-ptab');
          render();
        };
      });

      // Firma digital de seguridad (Módulo 00)
      const btnSignSafety = document.getElementById('btn-sign-safety');
      if (btnSignSafety) {
        btnSignSafety.onclick = () => {
          const sName = (document.getElementById('input-sign-name') || {}).value;
          const sEmail = (document.getElementById('input-sign-email') || {}).value;
          if (sName) state.user.name = sName;
          if (sEmail) state.user.email = sEmail;
          state.safetySigned = true;
          localStorage.setItem('qfdos_v4_safety_signed', 'true');
          render();
        };
      }

      const btnRevokeSafety = document.getElementById('btn-revoke-safety');
      if (btnRevokeSafety) {
        btnRevokeSafety.onclick = () => {
          state.safetySigned = false;
          localStorage.setItem('qfdos_v4_safety_signed', 'false');
          render();
        };
      }

      // Presets de Calculadora de Rendimientos (Módulo 02)
      const presetProp = document.getElementById('preset-prop');
      if (presetProp) {
        presetProp.onclick = () => {
          state.yieldCalc = { preset: 'propranolol', massA: 1.44, mwA: 144.17, massB: 1.85, mwB: 92.52, mwProd: 200.24, massProd: 1.62 };
          render();
        };
      }

      const presetDhpp = document.getElementById('preset-dhpp');
      if (presetDhpp) {
        presetDhpp.onclick = () => {
          state.yieldCalc = { preset: 'dhpp', massA: 1.06, mwA: 106.12, massB: 2.32, mwB: 116.12, mwProd: 301.34, massProd: 2.45 };
          render();
        };
      }

      const presetPara = document.getElementById('preset-paracetamol');
      if (presetPara) {
        presetPara.onclick = () => {
          state.yieldCalc = { preset: 'paracetamol', massA: 1.09, mwA: 109.13, massB: 1.20, mwB: 102.09, mwProd: 151.16, massProd: 1.25 };
          render();
        };
      }

      // Inputs numéricos de rendimiento
      ['massA', 'mwA', 'massB', 'mwB', 'mwProd', 'massProd'].forEach(f => {
        const inp = document.getElementById('yield-' + f);
        if (inp) {
          inp.oninput = (e) => {
            state.yieldCalc[f] = parseFloat(e.target.value) || 0;
            render();
          };
        }
      });

      // Calculadora de Disoluciones (Módulo 03)
      const solTarget = document.getElementById('sol-target');
      if (solTarget) {
        solTarget.onchange = (e) => {
          state.solutionCalc.target = e.target.value;
          render();
        };
      }

      ['c1', 'v1', 'c2', 'v2'].forEach(f => {
        const inp = document.getElementById('sol-' + f);
        if (inp) {
          inp.oninput = (e) => {
            state.solutionCalc[f] = parseFloat(e.target.value) || 0;
            render();
          };
        }
      });

      // Taller de Espectroscopia (Módulo 04)
      const btnCheckSpectro = document.getElementById('btn-check-spectro');
      if (btnCheckSpectro) {
        btnCheckSpectro.onclick = () => {
          state.spectroAssignments.forEach((row, i) => {
            const input = document.getElementById(`spectro-row-${i}`);
            if (input) row.proposed = input.value;
            row.checked = true;
          });
          render();
        };
      }

      const btnResetSpectro = document.getElementById('btn-reset-spectro');
      if (btnResetSpectro) {
        btnResetSpectro.onclick = () => {
          state.spectroAssignments.forEach(row => { row.checked = false; });
          render();
        };
      }

      // Checklist de Equipamiento (Módulo 05)
      document.querySelectorAll('.equip-checkbox').forEach(cb => {
        cb.onchange = (e) => {
          const eqId = e.target.getAttribute('data-eq-id');
          state.equipmentChecked[eqId] = e.target.checked;
          localStorage.setItem('qfdos_v4_equipment', JSON.stringify(state.equipmentChecked));
          render();
        };
      });

      // Simulador de Examen de Laboratorio (Módulo 06)
      examRadioListeners();

      const btnSubmitLabExam = document.getElementById('btn-submit-lab-exam');
      if (btnSubmitLabExam) {
        btnSubmitLabExam.onclick = () => {
          state.labExamSubmitted = true;
          render();
        };
      }

      const btnRetryLabExam = document.getElementById('btn-retry-lab-exam');
      if (btnRetryLabExam) {
        btnRetryLabExam.onclick = () => {
          state.labExamSubmitted = false;
          state.labExamAnswers = {};
          render();
        };
      }

      // Guardar Cuaderno de Parejas (Módulo 07)
      const btnSaveReport = document.getElementById('btn-save-pair-report');
      if (btnSaveReport) {
        btnSaveReport.onclick = () => {
          state.pairReport.pairNumber = (document.getElementById('rep-pair') || {}).value;
          state.pairReport.sessionDate = (document.getElementById('rep-date') || {}).value;
          state.pairReport.student1 = (document.getElementById('rep-student1') || {}).value;
          state.pairReport.student2 = (document.getElementById('rep-student2') || {}).value;
          state.pairReport.synthesisTitle = (document.getElementById('rep-title') || {}).value;
          state.pairReport.lotNumber = (document.getElementById('rep-lot') || {}).value;
          state.pairReport.obtainedMass = (document.getElementById('rep-mass') || {}).value;
          state.pairReport.meltingPoint = (document.getElementById('rep-mp') || {}).value;
          state.pairReport.observations = (document.getElementById('rep-obs') || {}).value;
          state.pairReport.submitted = true;
          localStorage.setItem('qfdos_v4_pair_report', JSON.stringify(state.pairReport));
          render();
        };
      }

      const btnPrintReport = document.getElementById('btn-print-pair-report');
      if (btnPrintReport) {
        btnPrintReport.onclick = () => { window.print(); };
      }

      // Simulador de Afinidad
      const simKd = document.getElementById('sim-kd');
      if (simKd) simKd.oninput = (e) => { state.affinitySim.kd = parseFloat(e.target.value); render(); };

      const simConc = document.getElementById('sim-conc');
      if (simConc) simConc.oninput = (e) => { state.affinitySim.ligandConc = parseFloat(e.target.value); render(); };

      const simBmax = document.getElementById('sim-bmax');
      if (simBmax) simBmax.oninput = (e) => { state.affinitySim.bmax = parseFloat(e.target.value); render(); };

      // Simulador de Evaluación Continua
      ['final', 'parcial', 'practicas', 'seminarios'].forEach(f => {
        const inp = document.getElementById('eval-' + f);
        if (inp) {
          inp.oninput = (e) => {
            const val = parseFloat(e.target.value) || 0;
            if (f === 'final') state.evalCalc.finalExam = val;
            if (f === 'parcial') state.evalCalc.parcial = val;
            if (f === 'practicas') state.evalCalc.practicas = val;
            if (f === 'seminarios') state.evalCalc.seminarios = val;
            render();
          };
        }
      });

      // Envío de consulta
      const btnSendQ = document.getElementById('btn-send-question');
      if (btnSendQ) {
        btnSendQ.onclick = () => {
          alert('Tu consulta ha sido registrada y enviada al profesorado. Recibirás respuesta en tu correo universitario.');
          state.activeModal = null;
          render();
        };
      }

      // Controles de Quiz Modal
      quizModalListeners();

      // Controles de Flashcard Modal
      flashcardModalListeners();

      // Controles Químicos y de Estructuras (RDKit WASM + PubChem API)
      chemEventListeners();
    }

    function examRadioListeners() {
      for (let i = 0; i < 5; i++) {
        document.querySelectorAll(`input[name="lab-exam-q-${i}"]`).forEach(radio => {
          radio.onchange = (e) => {
            state.labExamAnswers[i] = parseInt(e.target.value);
          };
        });
      }
    }

    function quizModalListeners() {
      document.querySelectorAll('input[name="quiz-opt"]').forEach(r => {
        r.onchange = (e) => {
          state.quizAnswers[state.activeQuizIndex] = parseInt(e.target.value);
        };
      });

      const btnCheck = document.getElementById('btn-quiz-check');
      if (btnCheck) btnCheck.onclick = () => { state.quizSubmitted = true; render(); };

      const btnReset = document.getElementById('btn-quiz-reset');
      if (btnReset) btnReset.onclick = () => { state.quizSubmitted = false; render(); };

      const btnPrev = document.getElementById('btn-quiz-prev');
      if (btnPrev) {
        btnPrev.onclick = () => {
          if (state.activeQuizIndex > 0) {
            state.activeQuizIndex--;
            state.quizSubmitted = false;
            render();
          }
        };
      }

      const btnNext = document.getElementById('btn-quiz-next');
      if (btnNext) {
        btnNext.onclick = () => {
          state.activeQuizIndex++;
          state.quizSubmitted = false;
          render();
        };
      }
    }

    function flashcardModalListeners() {
      const box = document.getElementById('flashcard-box');
      if (box) box.onclick = () => { state.flashcardFlipped = !state.flashcardFlipped; render(); };

      const btnFlip = document.getElementById('btn-fc-flip');
      if (btnFlip) btnFlip.onclick = () => { state.flashcardFlipped = !state.flashcardFlipped; render(); };

      const btnPrev = document.getElementById('btn-fc-prev');
      if (btnPrev) {
        btnPrev.onclick = () => {
          if (state.activeFlashcardIndex > 0) {
            state.activeFlashcardIndex--;
            state.flashcardFlipped = false;
            render();
          }
        };
      }

      const btnNext = document.getElementById('btn-fc-next');
      if (btnNext) {
        btnNext.onclick = () => {
          state.activeFlashcardIndex++;
          state.flashcardFlipped = false;
          render();
        };
      }
    }

    // ========================================================================
    // MANEJADORES DE EVENTOS DE QUÍMICA & ESTRUCTURAS (RDKIT & PUBCHEM)
    // ========================================================================
    function chemEventListeners() {
      // 1. Acciones en tarjetas de fármacos (Vista de Tema)
      document.querySelectorAll('[data-copy-smiles]').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const sm = btn.getAttribute('data-copy-smiles');
          if (navigator.clipboard) {
            navigator.clipboard.writeText(sm);
            const orig = btn.innerText;
            btn.innerText = '✓ COPIADO';
            btn.classList.add('btn-primary');
            setTimeout(() => {
              btn.innerText = orig;
              btn.classList.remove('btn-primary');
            }, 1800);
          }
        };
      });

      document.querySelectorAll('[data-toggle-pharma]').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const cardId = btn.getAttribute('data-toggle-pharma');
          state.activePharmacophoreToggles[cardId] = !state.activePharmacophoreToggles[cardId];
          render();
        };
      });

      document.querySelectorAll('[data-molview-smiles]').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const sm = btn.getAttribute('data-molview-smiles');
          window.open(getMolViewUrl(sm), '_blank');
        };
      });

      document.querySelectorAll('[data-pubchem-drug]').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const drug = btn.getAttribute('data-pubchem-drug');
          window.open(`https://pubchem.ncbi.nlm.nih.gov/#query=${encodeURIComponent(drug)}`, '_blank');
        };
      });

      document.querySelectorAll('[data-open-chem-lab]').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const drugName = btn.getAttribute('data-open-chem-lab');
          const sm = btn.getAttribute('data-smiles');
          state.chemLab.activeDrugName = drugName;
          state.chemLab.activeSmiles = sm;
          state.chemLab.searchQuery = drugName;
          state.chemLab.highlightActive = false;
          state.chemLab.pubchemData = null;
          state.chemLab.pubchemDescription = null;
          state.chemLab.pubchemSynonyms = [];
          state.screen = 'estructuras';
          window.scrollTo(0, 0);
          render();
        };
      });

      // 2. Controles de la pantalla "Laboratorio Químico" (screen: 'estructuras')
      document.querySelectorAll('[data-chem-preset]').forEach(btn => {
        btn.onclick = () => {
          const name = btn.getAttribute('data-chem-preset');
          const sm = btn.getAttribute('data-smiles');
          state.chemLab.activeDrugName = name;
          state.chemLab.activeSmiles = sm;
          state.chemLab.searchQuery = name;
          state.chemLab.highlightActive = false;
          state.chemLab.pubchemData = null;
          state.chemLab.pubchemDescription = null;
          state.chemLab.pubchemSynonyms = [];
          render();
        };
      });

      const inputQuery = document.getElementById('chem-lab-query-input');
      if (inputQuery) {
        inputQuery.onkeydown = (e) => {
          if (e.key === 'Enter') {
            const btnSearch = document.getElementById('btn-chem-search-pubchem');
            if (btnSearch) btnSearch.click();
          }
        };
        inputQuery.oninput = (e) => {
          state.chemLab.searchQuery = e.target.value;
        };
      }

      const btnPubChemSearch = document.getElementById('btn-chem-search-pubchem');
      if (btnPubChemSearch) {
        btnPubChemSearch.onclick = async () => {
          const q = (state.chemLab.searchQuery || '').trim();
          if (!q) return;

          state.chemLab.loadingPubChem = true;
          render();

          try {
            let pc = null;
            if (q.includes('=') || q.includes('#') || q.includes('(') || q.includes(')') || q.length > 25) {
              pc = await searchPubChemBySmiles(q);
            } else {
              pc = await searchPubChemByName(q);
            }

            if (pc) {
              state.chemLab.activeDrugName = pc.name || q;
              state.chemLab.activeSmiles = pc.canonicalSmiles || pc.isomericSmiles || q;
              state.chemLab.activeCid = pc.cid;
              state.chemLab.pubchemData = pc;

              if (pc.cid) {
                const desc = await fetchCompoundDescription(pc.cid);
                state.chemLab.pubchemDescription = desc;
                const syns = await fetchCompoundSynonyms(pc.cid, 12);
                state.chemLab.pubchemSynonyms = syns;
              }
            } else {
              alert(`No se encontró registro en PubChem para: "${q}". Puedes probar con su nombre en inglés o introduciendo su código SMILES.`);
            }
          } catch (err) {
            console.warn('Error consultando PubChem:', err);
          } finally {
            state.chemLab.loadingPubChem = false;
            render();
          }
        };
      }

      const btnLoadSmiles = document.getElementById('btn-chem-load-smiles');
      if (btnLoadSmiles) {
        btnLoadSmiles.onclick = () => {
          const q = (state.chemLab.searchQuery || '').trim();
          if (q) {
            state.chemLab.activeSmiles = q;
            state.chemLab.activeDrugName = 'Molécula Personalizada';
            state.chemLab.pubchemData = null;
            state.chemLab.pubchemDescription = null;
            state.chemLab.pubchemSynonyms = [];
            state.chemLab.highlightActive = false;
            render();
          }
        };
      }

      const btnMolView3D = document.getElementById('btn-chem-molview-3d');
      if (btnMolView3D) {
        btnMolView3D.onclick = () => {
          window.open(getMolViewUrl(state.chemLab.activeSmiles), '_blank');
        };
      }

      const btnPubChemLink = document.getElementById('btn-chem-pubchem-link');
      if (btnPubChemLink) {
        btnPubChemLink.onclick = () => {
          if (state.chemLab.activeCid) {
            window.open(getPubChemUrl(state.chemLab.activeCid), '_blank');
          } else {
            window.open(`https://pubchem.ncbi.nlm.nih.gov/#query=${encodeURIComponent(state.chemLab.activeDrugName || state.chemLab.activeSmiles)}`, '_blank');
          }
        };
      }

      const btnCopyLabSmiles = document.getElementById('btn-chem-copy-smiles');
      if (btnCopyLabSmiles) {
        btnCopyLabSmiles.onclick = () => {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(state.chemLab.activeSmiles);
            btnCopyLabSmiles.innerText = '✓ COPIADO';
            btnCopyLabSmiles.classList.add('btn-primary');
            setTimeout(() => {
              btnCopyLabSmiles.innerText = '📋 COPIAR';
              btnCopyLabSmiles.classList.remove('btn-primary');
            }, 1800);
          }
        };
      }

      const btnToggleHighlight = document.getElementById('btn-chem-toggle-highlight');
      if (btnToggleHighlight) {
        btnToggleHighlight.onclick = () => {
          state.chemLab.highlightActive = !state.chemLab.highlightActive;
          render();
        };
      }

      const btnApplySmarts = document.getElementById('btn-chem-apply-smarts');
      if (btnApplySmarts) {
        btnApplySmarts.onclick = () => {
          const input = document.getElementById('chem-custom-smarts-input');
          if (input) {
            state.chemLab.highlightSmarts = input.value.trim();
            state.chemLab.highlightActive = Boolean(state.chemLab.highlightSmarts);
            render();
          }
        };
      }

      const chkStereo = document.getElementById('chk-chem-stereo');
      if (chkStereo) {
        chkStereo.onchange = (e) => {
          state.chemLab.showStereo = e.target.checked;
          render();
        };
      }

      const selBondWidth = document.getElementById('sel-chem-bond-width');
      if (selBondWidth) {
        selBondWidth.onchange = (e) => {
          state.chemLab.bondWidth = parseFloat(e.target.value);
          render();
        };
      }

      // Comparador Tanimoto
      document.querySelectorAll('[data-compare-preset]').forEach(btn => {
        btn.onclick = () => {
          const preset = btn.getAttribute('data-compare-preset');
          if (preset === 'prop-aten') {
            state.chemLab.compareNameA = 'Propranolol';
            state.chemLab.compareSmilesA = 'CC(C)NCC(O)COc1cccc2ccccc12';
            state.chemLab.compareNameB = 'Atenolol';
            state.chemLab.compareSmilesB = 'CC(C)NCC(O)COc1ccc(CC(N)=O)cc1';
          } else if (preset === 'morf-nalox') {
            state.chemLab.compareNameA = 'Morfina';
            state.chemLab.compareSmilesA = 'CN1CCC23C4Oc5c(O)ccc(CC1C2C=CC4O)c35';
            state.chemLab.compareNameB = 'Naloxona';
            state.chemLab.compareSmilesB = 'C=CCN1CCC23C4Oc5c(O)ccc(CC1(C2C(=O)CC4)O)c35';
          } else if (preset === 'nife-amlo') {
            state.chemLab.compareNameA = 'Nifedipino';
            state.chemLab.compareSmilesA = 'COC(=O)C1=C(C)NC(C)=C(C(=O)OC)C1c2ccccc2[N+](=O)[O-]';
            state.chemLab.compareNameB = 'Amlodipino';
            state.chemLab.compareSmilesB = 'CCOC(=O)C1=C(COCCN)NC(C)=C(C(=O)OC)C1c2ccccc2Cl';
          } else if (preset === 'ibup-para') {
            state.chemLab.compareNameA = 'Ibuprofeno';
            state.chemLab.compareSmilesA = 'CC(C)Cc1ccc(cc1)C(C)C(=O)O';
            state.chemLab.compareNameB = 'Paracetamol';
            state.chemLab.compareSmilesB = 'CC(=O)Nc1ccc(O)cc1';
          } else if (preset === 'salb-adren') {
            state.chemLab.compareNameA = 'Salbutamol';
            state.chemLab.compareSmilesA = 'CC(C)(C)NCC(O)c1ccc(O)c(CO)c1';
            state.chemLab.compareNameB = 'Adrenalina';
            state.chemLab.compareSmilesB = 'CNC[C@H](O)c1ccc(O)c(O)c1';
          }
          render();
        };
      });

      const inputSmilesA = document.getElementById('input-compare-smiles-a');
      if (inputSmilesA) {
        inputSmilesA.onchange = (e) => {
          state.chemLab.compareSmilesA = e.target.value.trim();
          render();
        };
      }

      const inputSmilesB = document.getElementById('input-compare-smiles-b');
      if (inputSmilesB) {
        inputSmilesB.onchange = (e) => {
          state.chemLab.compareSmilesB = e.target.value.trim();
          render();
        };
      }

      const btnRecalcTanimoto = document.getElementById('btn-recalc-tanimoto');
      if (btnRecalcTanimoto) {
        btnRecalcTanimoto.onclick = () => {
          render();
        };
      }

      // Modal de búsqueda: abrir en Laboratorio Químico
      const btnModalOpenLab = document.getElementById('btn-modal-open-lab');
      if (btnModalOpenLab) {
        btnModalOpenLab.onclick = () => {
          const q = btnModalOpenLab.getAttribute('data-query');
          if (q) {
            state.chemLab.searchQuery = q;
            state.chemLab.activeDrugName = q;
          }
          state.screen = 'estructuras';
          state.activeModal = null;
          render();
          const trigger = document.getElementById('btn-chem-search-pubchem');
          if (trigger && q) trigger.click();
        };
      }
    }

    // ========================================================================
    // CARGADOR ASÍNCRONO DE ESTRUCTURAS, REACCIONES Y DESCRIPTORES
    // ========================================================================
    async function loadMoleculesSvgAsync() {
      // 1. Renderizar ranuras 2D en tarjetas de temas con soporte de farmacóforos
      const topicContainers = document.querySelectorAll('.chem-svg-container[data-card-id]');
      for (const el of topicContainers) {
        const smiles = el.getAttribute('data-smiles');
        const drugName = el.getAttribute('data-drug');
        const cardId = el.getAttribute('data-card-id');
        if (smiles) {
          const isPharma = Boolean(state.activePharmacophoreToggles[cardId]);
          const pharmaInfo = isPharma ? getPharmacophoreForDrug(drugName, smiles) : null;
          const svg = await renderMoleculeSvg(smiles, {
            width: 280,
            height: 160,
            highlightSmarts: pharmaInfo ? pharmaInfo.smarts : null,
            addStereoAnnotation: true,
            bondLineWidth: 2.0
          });
          if (svg) el.innerHTML = svg;
        }
      }

      // 2. Renderizar esquemas de reacción en Prácticas (Módulo 01)
      const rxnContainers = document.querySelectorAll('.chem-reaction-container[data-rxn]');
      for (const el of rxnContainers) {
        const rxn = el.getAttribute('data-rxn');
        const reagents = el.getAttribute('data-reagents') || '';
        if (rxn) {
          const svg = await renderReactionSvg(rxn, {
            width: 620,
            height: 180,
            reagents: reagents,
            bondLineWidth: 2.0
          });
          if (svg) el.innerHTML = svg;
        }
      }

      // 3. Renderizar el workbench completo si estamos en la pantalla "estructuras"
      if (state.screen === 'estructuras') {
        const lab = state.chemLab;
        const mainSlot = document.getElementById('chem-lab-main-svg');
        if (mainSlot && lab.activeSmiles) {
          const pharmaInfo = getPharmacophoreForDrug(lab.activeDrugName, lab.activeSmiles);
          const activeSmarts = lab.highlightActive ? (lab.highlightSmarts || (pharmaInfo ? pharmaInfo.smarts : null)) : null;

          const mainSvg = await renderMoleculeSvg(lab.activeSmiles, {
            width: 440,
            height: 260,
            highlightSmarts: activeSmarts,
            addStereoAnnotation: lab.showStereo,
            bondLineWidth: lab.bondWidth
          });
          if (mainSvg) mainSlot.innerHTML = mainSvg;

          // Calcular descriptores moleculares con RDKit
          const desc = await computeDescriptors(lab.activeSmiles);
          if (desc) {
            const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
            setVal('val-mw', desc.mw + ' Da');
            setVal('val-logp', desc.logp);
            setVal('val-hbd', desc.hbd);
            setVal('val-hba', desc.hba);
            setVal('val-tpsa', desc.tpsa + ' Å²');
            setVal('val-rotb', desc.rotb);
            setVal('val-csp3', desc.fractionCsp3);
            setVal('val-arom', desc.aromaticRings);
            setVal('val-heavy', desc.heavyAtoms);

            // Evaluar reglas de Lipinski y Veber
            const report = await evaluateLipinskiVeber(desc);
            if (report && report.valid) {
              const setBadge = (id, passed, passText = 'PASA', failText = 'FALLA') => {
                const el = document.getElementById(id);
                if (el) {
                  el.className = passed ? 'chem-badge-ok' : 'chem-badge-fail';
                  el.innerText = passed ? `✓ ${passText}` : `✕ ${failText}`;
                }
              };

              const lip = report.lipinski;
              const veb = report.veber;
              setBadge('badge-mw', desc.mw <= 500);
              setBadge('badge-logp', desc.logp <= 5.0);
              setBadge('badge-hbd', desc.hbd <= 5);
              setBadge('badge-hba', desc.hba <= 10);
              setBadge('badge-veber-rotb', desc.rotb <= 10);
              setBadge('badge-veber-tpsa', desc.tpsa <= 140.0);

              const verdictTitle = document.getElementById('chem-verdict-title');
              const verdictDesc = document.getElementById('chem-verdict-desc');
              const verdictBox = document.getElementById('chem-verdict-box');

              if (verdictTitle && verdictDesc) {
                if (report.drugLike) {
                  verdictTitle.innerText = '✓ PERFIL ÓPTIMO DE DROGABILIDAD Y ABSORCIÓN ORAL';
                  verdictDesc.innerText = `Cumple estrictamente la Regla de 5 de Lipinski (${lip.violations} violaciones) y ambos criterios de Veber (RotB = ${desc.rotb}, TPSA = ${desc.tpsa} Å²). Favorable para desarrollo farmacéutico oral.`;
                  if (verdictBox) verdictBox.style.borderLeftColor = '#166534';
                } else {
                  verdictTitle.innerText = '✕ VIOLACIÓN DE CRITERIOS DE BIODISPONIBILIDAD ORAL';
                  verdictDesc.innerText = `Presenta ${lip.violations} violaciones de Lipinski y ${veb.violations} violaciones de Veber. Sugiere permeabilidad intestinal o solubilidad restringida (requeriría optimización estructural o formulación parenteral/especial).`;
                  if (verdictBox) verdictBox.style.borderLeftColor = 'var(--color-accent)';
                }
              }
            }
          }
        }

        // Renderizar moléculas del comparador (A y B)
        const slotA = document.getElementById('chem-compare-svg-a');
        if (slotA && lab.compareSmilesA) {
          const svgA = await renderMoleculeSvg(lab.compareSmilesA, { width: 260, height: 160 });
          if (svgA) slotA.innerHTML = svgA;
        }

        const slotB = document.getElementById('chem-compare-svg-b');
        if (slotB && lab.compareSmilesB) {
          const svgB = await renderMoleculeSvg(lab.compareSmilesB, { width: 260, height: 160 });
          if (svgB) slotB.innerHTML = svgB;
        }

        // Calcular coeficiente Tanimoto
        if (lab.compareSmilesA && lab.compareSmilesB) {
          const simResult = await calculateTanimoto(lab.compareSmilesA, lab.compareSmilesB);
          if (simResult && simResult.valid) {
            const scoreText = document.getElementById('tanimoto-score-text');
            const bar = document.getElementById('tanimoto-bar');
            const bitsA = document.getElementById('tanimoto-bits-a');
            const bitsB = document.getElementById('tanimoto-bits-b');
            const bitsCommon = document.getElementById('tanimoto-bits-common');
            const interp = document.getElementById('tanimoto-interpretation');

            if (scoreText) scoreText.innerText = `${simResult.similarityPercent} SIMILITUD (T = ${simResult.similarity})`;
            if (bar) bar.style.width = simResult.similarityPercent;
            if (bitsA) bitsA.innerText = `${simResult.bitsA} bits`;
            if (bitsB) bitsB.innerText = `${simResult.bitsB} bits`;
            if (bitsCommon) bitsCommon.innerText = `${simResult.commonBits} bits coincidentes`;

            if (interp) {
              if (simResult.similarity >= 0.85) {
                interp.innerHTML = `<strong>Alta Homología Estructural (T = ${simResult.similarity}):</strong> Fuerte conservación farmacofórica y topológica. Gran probabilidad de compartir afinidad por la misma diana macromolecular con perfil SAR semejante.`;
              } else if (simResult.similarity >= 0.60) {
                interp.innerHTML = `<strong>Similitud Media-Alta (T = ${simResult.similarity}):</strong> Comparten subestructuras clave o núcleo heterocíclico central, con modificaciones periféricas que modulan la selectividad o solubilidad.`;
              } else {
                interp.innerHTML = `<strong>Baja Similitud Global (T = ${simResult.similarity}):</strong> Estructuras topológicamente divergentes o esqueletos químicos diferentes (ej. scaffold hopping).`;
              }
            }
          }
        }
      }
    }

    // Arranque inicial
    initRDKit();
    render();
  </script>
</body>
</html>
