<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>QFDOS v4 — Química Farmacéutica II · Modernist</title>
  <meta name="description" content="Portal docente de Química Farmacéutica II (Grupo E), Grado en Farmacia, Universidad de Granada. Diseño Modernist." />
  <link rel="icon" type="image/png" href="https://i.ibb.co/HLCYDc3c/Logo-primario-QFDOS.png" />

  <!-- Tipografía: Archivo (UI) · JetBrains Mono (Datos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos Modernist -->
  <link rel="stylesheet" href="src/styles/modernist.css" />

  <!-- RDKit MinimalLib (WASM) para renderizado 2D de estructuras químicas -->
  <script src="https://unpkg.com/@rdkit/rdkit@2025.3.4-1.0.0/dist/RDKit_minimal.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Carga del bundle de datos completo de QFDOS -->
  <script src="src/data/qfdosDataBundle.js"></script>

  <!-- Aplicación SPA Modernist -->
  <script type="module">
    import {
      initRDKit,
      renderMoleculeSvg,
      renderReactionSvg,
      computeDescriptors,
      evaluateLipinskiVeber,
      calculateTanimoto,
      COMMON_PHARMACOPHORES,
      getPharmacophoreForDrug
    } from './src/utils/rdkitEngine.js';
    import {
      searchPubChemByName,
      searchPubChemBySmiles,
      searchPubChemByCid,
      fetchPubChemAutocomplete,
      fetchCompoundDescription,
      fetchCompoundSynonyms,
      getPubChem2DImageUrl,
      getPubChem3DConformerUrl,
      getMolViewUrl,
      getPubChemUrl
    } from './src/utils/pubchemService.js';

    // Obtener datos maestros cargados desde el bundle
    const DATA = window.QFDOS_DATA || {};
    const TOPICS = DATA.INITIAL_TOPICS || [];
    const ANNOUNCEMENTS = DATA.INITIAL_ANNOUNCEMENTS || [];
    const GLOSSARY = DATA.INITIAL_GLOSSARY || [];
    const RESOURCE_LINKS = DATA.INITIAL_RESOURCE_LINKS || [];
    const COURSE_INFO = DATA.COURSE_GENERAL_INFO || {};
    const FIR_QUESTIONS = DATA.FIR_QUESTIONS || [];
    const NORMAS_SEGURIDAD = DATA.NORMAS_SEGURIDAD_CHECKLIST || [];
    const LAB_EQUIPMENT = DATA.LAB_EQUIPMENT_INVENTORY || [];
    const PRACTICE_EXAM_QUESTIONS = DATA.PRACTICE_EXAM_QUESTIONS || [];
    const COMPOUND_SPECTRA = DATA.COMPOUND_SPECTRA_DATA || {};
    const REACTION_STEPS = DATA.LAB_REACTION_STEPS || [];

    // Estado global de la aplicación
    const state = {
      screen: localStorage.getItem('qfdos_v4_user') ? 'hub' : 'login',
      user: JSON.parse(localStorage.getItem('qfdos_v4_user') || '{"role":"estudiante","name":"Estudiante QFDOS","email":"estudiante@correo.ugr.es"}'),
      safetySigned: localStorage.getItem('qfdos_v4_safety_signed') === 'true',
      selectedTopicId: 'tema-01',
      activeModal: null, // 'search' | 'question' | 'spotify' | 'quiz' | 'flashcards' | 'fir'
      searchTerm: '',
      modalData: null,
      practicasTab: '00', // '00' | '01' | '02' | '03' | '04' | '05' | '06' | '07'

      // Estado de Calculadora de Rendimientos (Módulo 02)
      yieldCalc: {
        preset: 'propranolol',
        massA: 1.44, // g α-naftol
        mwA: 144.17,
        massB: 1.85, // g epiclorhidrina
        mwB: 92.52,
        mwProd: 200.24, // g/mol oxirano intermedio
        massProd: 1.62 // masa obtenida real
      },

      // Estado de Calculadora de Disoluciones (Módulo 03)
      solutionCalc: {
        c1: 1.0, // M
        v1: 50.0, // mL
        c2: 0.1, // M
        v2: 500.0, // mL
        target: 'v1'
      },

      // Estado de Taller de Espectroscopia (Módulo 04)
      spectroCompound: 'propranolol',
      spectroAssignments: [
        { peak: '1.20', mult: 'd', integral: '6H', proposed: '-CH(CH3)2', checked: false, correct: true },
        { peak: '2.85', mult: 'm', integral: '1H', proposed: '-CH(CH3)2', checked: false, correct: true },
        { peak: '4.10', mult: 'm', integral: '3H', proposed: '-O-CH2-CH(OH)-', checked: false, correct: true },
        { peak: '7.2-8.3', mult: 'm', integral: '7H', proposed: 'Protones aromáticos naftilo', checked: false, correct: true }
      ],

      // Estado de Checklist de Equipamiento (Módulo 05)
      equipmentChecked: JSON.parse(localStorage.getItem('qfdos_v4_equipment') || '{}'),

      // Estado de Simulador de Examen de Prácticas (Módulo 06)
      labExamAnswers: {},
      labExamSubmitted: false,

      // Estado de Cuaderno de Parejas (Módulo 07)
      pairReport: JSON.parse(localStorage.getItem('qfdos_v4_pair_report') || JSON.stringify({
        pairNumber: '12',
        student1: 'García Pérez, Elena',
        student2: 'López Martínez, Carlos',
        sessionDate: '2026-10-15',
        synthesisTitle: 'Síntesis de Propranolol (Apertura de Oxirano)',
        lotNumber: 'PROP-2026-E12',
        obtainedMass: '1.58',
        meltingPoint: '95-96 °C',
        rfValue: '0.45 (Hexano/AcOEt 7:3)',
        observations: 'Cristalización en caliente con etanol al 96%. Cristales aciculares incoloros de alta pureza.',
        submitted: false
      })),

      // Estado de Simulador Biofísico de Afinidad
      affinitySim: {
        kd: 10, // nM
        bmax: 1000, // fmol/mg
        ligandConc: 25 // nM
      },

      // Estado de Simulador de Evaluación Continua
      evalCalc: {
        finalExam: 6.5,
        parcial: 7.0,
        practicas: 8.5,
        seminarios: 9.0
      },

      // Estado de Quizzes y Flashcards
      activeQuizIndex: 0,
      quizAnswers: {},
      quizSubmitted: false,
      activeFlashcardIndex: 0,
      flashcardFlipped: false,

      // Estado de Laboratorio Químico & Estructuras
      chemLab: {
        activeDrugName: 'Propranolol',
        activeSmiles: 'CC(C)NCC(O)COc1cccc2ccccc12',
        activeCid: 4946,
        highlightSmarts: '[#6]~[#6]-[#8]-[#6]-[#6](-[#8])-[#6]-[#7]', // Ariloxipropanolamina
        highlightActive: false,
        bondWidth: 2.0,
        showStereo: true,
        descriptors: null,
        lipinskiReport: null,
        pubchemData: null,
        pubchemDescription: null,
        pubchemSynonyms: [],
        loadingPubChem: false,
        searchQuery: 'Propranolol',
        // Comparador Molecular (Tanimoto / Morgan Fingerprints)
        compareNameA: 'Propranolol',
        compareSmilesA: 'CC(C)NCC(O)COc1cccc2ccccc12',
        compareNameB: 'Atenolol',
        compareSmilesB: 'CC(C)NCC(O)COc1ccc(CC(N)=O)cc1',
        similarityResult: null
      },
      // Topic cards highlighted pharmacophore toggles
      activePharmacophoreToggles: {}
    };

    // Render principal
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (state.screen === 'login') {
        app.innerHTML = renderLoginScreen();
      } else {
        app.innerHTML = `
          ${renderHeader()}
          <main id="main-content" style="padding-bottom: 70px;">
            ${renderScreenContent()}
          </main>
          ${renderMobileNav()}
          ${state.activeModal ? renderActiveModal() : ''}
        `;
      }

      attachEventListeners();
      loadMoleculesSvgAsync();
    }

    // ========================================================================
    // PANTALLA 1: LOGIN
    // ========================================================================
    function renderLoginScreen() {
      return `
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background-color: var(--color-bg);">
          <div style="width: 100%; max-width: 680px; background: #ffffff; border: 2px solid var(--color-border); padding: 40px; box-shadow: var(--shadow-modal);">
            <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
              <span class="tag tag-accent">UGR · GRADO EN FARMACIA</span>
              <span class="tag tag-neutral">GRUPO E · CURSO 2026/27</span>
              <span class="tag tag-outline">6 ECTS</span>
            </div>

            <div class="kicker">DEPARTAMENTO DE QUÍMICA FARMACÉUTICA Y ORGÁNICA</div>
            <h1 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.02em;">QUÍMICA FARMACÉUTICA II</h1>
            <p style="font-size: 1.05rem; color: var(--color-text-secondary); margin-bottom: 24px;">
              Portal Docente v4 · Modernist Design System. Acceso oficial a temario, dianas estructurales PDB, monografías moleculares, simuladores biofísicos y cuaderno digital de laboratorio.
            </p>

            <div class="hr"></div>

            <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px;">
              <button class="btn btn-primary btn-lg btn-block" id="btn-login-google">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
                CONTINUAR CON GOOGLE (ACCESO UGR)
              </button>
              
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="btn btn-secondary btn-block" id="btn-login-guest">
                  ACCESO REVISIÓN / INVITADO
                </button>
                <button class="btn btn-secondary btn-block" id="btn-login-teacher">
                  MODO DOCENTE / PROFESOR
                </button>
              </div>
            </div>

            <div class="grid-2" style="margin-top: 24px;">
              <div class="card" style="padding: 16px; border: 1px solid var(--color-border); background-color: var(--color-surface-dim);">
                <span class="tag tag-outline" style="margin-bottom: 6px;">PERFIL ESTUDIANTE</span>
                <h4 style="margin-bottom: 4px;">Cuaderno & Evaluaciones</h4>
                <p style="font-size: 0.8rem; color: var(--color-text-secondary);">
                  Acceso al cuaderno de laboratorio digital, normas de seguridad firmadas, calculadoras estequiométricas y test interactivo de autoevaluación.
                </p>
              </div>
              <div class="card" style="padding: 16px; border: 1px solid var(--color-border); background-color: var(--color-surface-dim);">
                <span class="tag tag-accent" style="margin-bottom: 6px;">COORDINACIÓN DOCENTE</span>
                <h4 style="margin-bottom: 4px;">Dr. Juan José Díaz-Mochón</h4>
                <p style="font-size: 0.8rem; color: var(--color-text-secondary);">
                  Profesor Titular · Teoría Grupo E. Despacho en Facultad de Farmacia (Cartuja) y Centro GENYO (PTS).
                </p>
              </div>
            </div>

            <div class="card-meta" style="margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--color-border-subtle); display: flex; justify-content: space-between;">
              <span>UGR · FACULTAD DE FARMACIA</span>
              <span>QFDOS PORTAL v4.0</span>
            </div>
          </div>
        </div>
      `;
    }

    // ========================================================================
    // HEADER & NAVEGACIÓN
    // ========================================================================
    function renderHeader() {
      const isTeacher = state.user.role === 'profesor';
      return `
        <header class="header-sticky">
          <div class="header-topbar">
            <div>UNIVERSIDAD DE GRANADA · FACULTAD DE FARMACIA · 2627 QFDOS E</div>
            <div>TURNO DE TARDE · GRUPO E · CURSO 2026/27</div>
          </div>
          <div class="header-main">
            <div class="brand-title" id="brand-link">
              <span>QFDOS</span>
              <span class="brand-badge">PORTAL v4</span>
            </div>

            <nav class="nav-links">
              <span class="nav-link ${state.screen === 'hub' ? 'active' : ''}" data-nav="hub">HUB</span>
              <span class="nav-link ${state.screen === 'curso' ? 'active' : ''}" data-nav="curso">CURSO</span>
              <span class="nav-link ${state.screen === 'temario' || state.screen === 'topic' ? 'active' : ''}" data-nav="temario">TEMARIO</span>
              <span class="nav-link ${state.screen === 'practicas' ? 'active' : ''}" data-nav="practicas">PRÁCTICAS</span>
              <span class="nav-link ${state.screen === 'estructuras' ? 'active' : ''}" data-nav="estructuras">ESTRUCTURAS [LAB]</span>
              <span class="nav-link ${state.screen === 'simulador' ? 'active' : ''}" data-nav="simulador">AFINIDAD</span>
              <span class="nav-link ${state.screen === 'evaluacion' ? 'active' : ''}" data-nav="evaluacion">EVALUACIÓN</span>
              <span class="nav-link ${state.screen === 'glosario' ? 'active' : ''}" data-nav="glosario">GLOSARIO</span>
              <span class="nav-link ${state.screen === 'enlaces' ? 'active' : ''}" data-nav="enlaces">ENLACES</span>
            </nav>

            <div style="display: flex; align-items: center; gap: 8px;">
              <button class="btn btn-secondary btn-sm" id="btn-trigger-search" title="Buscar fármacos o temas (Ctrl+K)">
                BUSCADOR [⌘K]
              </button>
              <button class="btn btn-secondary btn-sm" id="btn-trigger-podcast" title="Escuchar Podcast QFDOS">
                PODCAST
              </button>
              <button class="btn btn-ghost btn-sm" id="btn-logout" title="Cerrar sesión">
                SALIR [${state.user.role.toUpperCase()}]
              </button>
            </div>
          </div>
        </header>
      `;
    }

    function renderMobileNav() {
      return `
        <div class="mobile-nav-bottom">
          <span class="nav-link ${state.screen === 'hub' ? 'active' : ''}" data-nav="hub">HUB</span>
          <span class="nav-link ${state.screen === 'temario' || state.screen === 'topic' ? 'active' : ''}" data-nav="temario">TEMAS</span>
          <span class="nav-link ${state.screen === 'estructuras' ? 'active' : ''}" data-nav="estructuras">MOL</span>
          <span class="nav-link ${state.screen === 'practicas' ? 'active' : ''}" data-nav="practicas">LAB</span>
          <span class="nav-link" id="mobile-btn-search">BUSCAR</span>
        </div>
      `;
    }

    // ========================================================================
    // ROUTER DE CONTENIDO
    // ========================================================================
    function renderScreenContent() {
      switch (state.screen) {
        case 'hub': return renderHubScreen();
        case 'curso': return renderCursoScreen();
        case 'temario': return renderTemarioScreen();
        case 'topic': return renderTopicScreen();
        case 'estructuras': return renderEstructurasScreen();
        case 'practicas': return renderPracticasScreen();
        case 'simulador': return renderSimuladorScreen();
        case 'evaluacion': return renderEvaluacionScreen();
        case 'glosario': return renderGlosarioScreen();
        case 'enlaces': return renderEnlacesScreen();
        default: return renderHubScreen();
      }
    }

    // ========================================================================
    // PANTALLA 2: HUB (DASHBOARD)
    // ========================================================================
    function renderHubScreen() {
      const topTopics = TOPICS.slice(1, 5); // Excluye Tema 00 para la preview de 4 temas
      return `
        <div class="container">
          <!-- Hero Section -->
          <div class="hero-architectural">
            <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
              <span class="tag tag-accent">GRUPO E · TURNO DE TARDE</span>
              <span class="tag tag-neutral">EVALUACIÓN CONTINUA (70/20/5/5)</span>
              <span class="tag tag-outline">AULA 7 · L, M, J 17:00H</span>
            </div>
            <div class="kicker">ASIGNATURA OBLIGATORIA · 4.º CURSO · GRADO EN FARMACIA</div>
            <h1 class="hero-title">QUÍMICA FARMACÉUTICA II</h1>
            <p class="hero-subtitle">
              Portal docente y cuaderno digital de laboratorio oficial. Diseño molecular biofísico, relaciones estructura-actividad (SAR), síntesis en laboratorio, mecanismos enzimáticos y banco oficial de preparación FIR.
            </p>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
              <button class="btn btn-primary" data-nav="temario">EXPLORAR TEMARIO [11 TEMAS]</button>
              <button class="btn btn-secondary" data-nav="practicas">CUADERNO DE LABORATORIO</button>
              <button class="btn btn-dark" id="btn-hero-fir">SIMULADOR OFICIAL FIR</button>
            </div>
          </div>

          <!-- Fila de 4 Estadísticas con Reglas Verticales -->
          <div class="stat-row" style="margin-bottom: 36px;">
            <div class="stat-col">
              <div class="stat-value">11</div>
              <div class="stat-label">Unidades Temáticas</div>
            </div>
            <div class="stat-col">
              <div class="stat-value">54</div>
              <div class="stat-label">Fármacos Monografiados</div>
            </div>
            <div class="stat-col">
              <div class="stat-value">136</div>
              <div class="stat-label">Preguntas Oficiales FIR</div>
            </div>
            <div class="stat-col">
              <div class="stat-value">80+</div>
              <div class="stat-label">Flashcards de Estudio</div>
            </div>
          </div>

          <!-- Dos Columnas: Avisos + Herramientas -->
          <div class="grid-2" style="margin-bottom: 40px;">
            <!-- Columna Avisos -->
            <div class="card">
              <div class="card-kicker">DOCENCIA & CALENDARIO</div>
              <h2 class="card-title">Tablón Oficial de Avisos</h2>
              <p class="card-body" style="margin-bottom: 16px;">
                Comunicados oficiales del Dr. Juan José Díaz-Mochón y avisos de incidencias de prácticas.
              </p>
              
              <div style="display: flex; flex-direction: column; gap: 14px;">
                ${ANNOUNCEMENTS.map(a => `
                  <div style="border-left: 3px solid var(--color-accent); padding-left: 14px; background: var(--color-bg); padding: 12px 14px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                      <span class="tag tag-mono" style="font-size: 0.68rem;">${a.date}</span>
                      <span class="tag ${a.priority === 'alta' ? 'tag-accent' : 'tag-neutral'}">${a.category || 'Aviso'}</span>
                    </div>
                    <div style="font-weight: 800; font-size: 0.95rem; margin-bottom: 4px;">${a.title}</div>
                    <div style="font-size: 0.85rem; color: var(--color-text-secondary); line-height: 1.4;">${a.content}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Columna Herramientas Rápidas -->
            <div style="display: flex; flex-direction: column; gap: 16px;">
              <div class="grid-2">
                <div class="card card-interactive" data-nav="curso" style="cursor: pointer;">
                  <span class="tag tag-accent" style="margin-bottom: 8px;">CURSO</span>
                  <h3 style="font-size: 1.1rem; margin-bottom: 6px;">Guía & Horarios</h3>
                  <p style="font-size: 0.82rem; color: var(--color-text-muted);">
                    Horarios de clase (Aula 7), calendario de exámenes con ponderación oficial y tutorías.
                  </p>
                </div>

                <div class="card card-interactive" data-nav="practicas" style="cursor: pointer;">
                  <span class="tag tag-accent" style="margin-bottom: 8px;">LABORATORIO</span>
                  <h3 style="font-size: 1.1rem; margin-bottom: 6px;">Prácticas QFDOS</h3>
                  <p style="font-size: 0.82rem; color: var(--color-text-muted);">
                    Normas, protocolos, calculadora estequiométrica, disoluciones y cuaderno de parejas.
                  </p>
                </div>

                <div class="card card-interactive" id="card-quick-search" style="cursor: pointer;">
                  <span class="tag tag-neutral" style="margin-bottom: 8px;">BUSCADOR</span>
                  <h3 style="font-size: 1.1rem; margin-bottom: 6px;">Fármacos & Dianas</h3>
                  <p style="font-size: 0.82rem; color: var(--color-text-muted);">
                    Búsqueda instantánea con estructuras químicas 2D, códigos PDB y propiedades.
                  </p>
                </div>

                <div class="card card-interactive" id="card-quick-question" style="cursor: pointer;">
                  <span class="tag tag-neutral" style="margin-bottom: 8px;">BUZÓN</span>
                  <h3 style="font-size: 1.1rem; margin-bottom: 6px;">Consultas Docentes</h3>
                  <p style="font-size: 0.82rem; color: var(--color-text-muted);">

                  <button class="btn btn-primary btn-sm" data-nav="estructuras">LABORATORIO QUÍMICO [RDKIT]</button>

                  <button class="btn btn-secondary btn-sm" data-nav="evaluacion">CALCULADORA DE NOTA</button>

                <h2>Unidades Temáticas Destacadas</h2>
              </div>
              <button class="btn btn-secondary btn-sm" data-nav="temario">VER TODOS LOS TEMAS [11]</button>

            <div class="grid-4">
              ${topTopics.map(t => `
                <div class="card card-interactive" data-open-topic="${t.id}" style="cursor: pointer;">
                  <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                    <span class="tag tag-mono">${t.number}</span>
                    <span class="tag tag-accent">PUBLICADO</span>
                  </div>
                  <h3 style="font-size: 1.1rem; margin-bottom: 6px;">${t.title}</h3>

          <!-- Monografías de Fármacos de Referencia -->

            ${(!topic.drugs || topic.drugs.length === 0) ? `

                  // Evaluación preliminar de Lipinski & Veber
                  const mwOk = !d.mw || d.mw <= 500;
                  const logpOk = d.logP === undefined || d.logP <= 5.0;
                  const hbdOk = d.hbd === undefined || d.hbd <= 5;
                  const hbaOk = d.hba === undefined || d.hba <= 10;
                  let violations = 0;
                  if (!mwOk) violations++;
                  if (!logpOk) violations++;
                  if (!hbdOk) violations++;
                  if (!hbaOk) violations++;
                  const ro5Passed = violations <= 1;

                  const rotbOk = d.rotBonds === undefined || d.rotBonds <= 10;
                  const tpsaOk = d.tpsa === undefined || d.tpsa <= 140;
                  const veberPassed = rotbOk && tpsaOk;

                  return `

                        </div>
                      </div>

                      <!-- Visualizador 2D Vectorial de Estructura Química con RDKit WASM -->
                      <div class="chem-svg-container" id="chem-slot-${topic.id}-${idx}" data-smiles="${d.smiles}" data-drug="${d.name}" data-card-id="${cardId}" style="margin: 12px 0;">
                        <div class="mono" style="font-size: 0.8rem; color: var(--color-text-muted);">Generando estructura 2D RDKit...</div>
                      </div>

                      <!-- Barra de Acciones Químicas -->
                      <div class="chem-card-actions">
                        <button class="btn ${isPharmaActive ? 'btn-primary' : 'btn-secondary'} btn-xs" data-toggle-pharma="${cardId}" title="Resaltar farmacóforo característico en rojo moderno (#ec3013)">
                          ${isPharmaActive ? '✓ FARMACÓFORO ACTIVO' : '⚡ RESALTAR FARMACÓFORO'}
                        </button>
                        <button class="btn btn-secondary btn-xs" data-copy-smiles="${d.smiles}" title="Copiar cadena SMILES al portapapeles">
                          📋 SMILES
                        </button>
                        <button class="btn btn-secondary btn-xs" data-molview-smiles="${d.smiles}" title="Abrir conformador 3D interactivo en MolView">
                          🧊 VER 3D ↗
                        </button>
                        <button class="btn btn-secondary btn-xs" data-pubchem-drug="${d.name}" title="Consultar monografía oficial en NCBI PubChem">
                          🔬 PUBCHEM ↗
                        </button>
                        <button class="btn btn-dark btn-xs" data-open-chem-lab="${d.name}" data-smiles="${d.smiles}" title="Cargar este fármaco en el Laboratorio Molecular QFDOS">
                          🧪 LAB [RDKIT] ➔
                        </button>
                      </div>

                      ${isPharmaActive && pharmaInfo ? `
                        <div style="background: var(--color-surface-dim); border-left: 3px solid var(--color-accent); padding: 8px 10px; margin-bottom: 10px; font-size: 0.76rem;">
                          <strong style="color: var(--color-accent);">${pharmaInfo.name}:</strong> ${pharmaInfo.description || 'Subestructura farmacofórica resaltada en Modernist Red.'}
                          <div class="mono" style="font-size: 0.68rem; color: var(--color-text-muted); margin-top: 2px;">SMARTS: ${pharmaInfo.smarts}</div>
                        </div>
                      ` : ''}

                      <!-- Tira de Descriptores Fisicoquímicos y Reglas Biofísicas -->
                      <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;">
                        <span class="${ro5Passed ? 'chem-badge-ok' : 'chem-badge-fail'}" title="Regla de 5 de Lipinski para absorción oral">
                          ${ro5Passed ? '✓ LIPINSKI OK' : `✕ LIPINSKI: ${violations} VIOL.`}
                        </span>
                        <span class="${veberPassed ? 'chem-badge-ok' : 'chem-badge-fail'}" title="Criterios de Veber: RotB ≤ 10 y TPSA ≤ 140 Å²">
                          ${veberPassed ? '✓ VEBER OK' : '✕ VEBER EXCEDIDO'}
                        </span>
                        <span class="chem-badge-neutral">MW: ${d.mw ? d.mw + ' Da' : '—'}</span>
                        <span class="chem-badge-neutral">cLogP: ${d.logP !== undefined ? d.logP : '—'}</span>
                        <span class="chem-badge-neutral">HBD: ${d.hbd !== undefined ? d.hbd : '—'}</span>
                        <span class="chem-badge-neutral">HBA: ${d.hba !== undefined ? d.hba : '—'}</span>
                        ${d.tpsa ? `<span class="chem-badge-neutral">TPSA: ${d.tpsa} Å²</span>` : ''}
                        ${d.rotBonds !== undefined ? `<span class="chem-badge-neutral">RotB: ${d.rotBonds}</span>` : ''}

                        <td><strong>${n.title}</strong><div style="font-size: 0.8rem; color: var(--color-text-secondary);">${n.description}</div></td>
                        <td>${n.rationale || 'Prevención de accidentes y contaminación'}</td>
                        <td><span class="tag tag-neutral">${n.epiRequired ? n.epiRequired.join(', ') : 'Bata y Gafas'}</span></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <div style="background-color: var(--color-surface-dim); border: 2px solid var(--color-border); padding: 24px;">
                <div class="card-kicker">COMPUERTA DE REGISTRO & COMPROMISO</div>
                <h3 style="margin-bottom: 8px;">Firma Digital del Alumno/a</h3>
                <p style="font-size: 0.88rem; color: var(--color-text-secondary); margin-bottom: 16px;">
                  Declaro haber leído, comprendido y aceptado las normas de seguridad del laboratorio de Química Farmacéutica II de la UGR.
                </p>

                ${state.safetySigned ? `
                  <div style="background: #dcfce7; border: 2px solid #166534; padding: 14px; color: #166534; font-weight: 700; margin-bottom: 12px;">
                    ✓ NORMAS ACEPTADAS Y FIRMADAS DIGITALMENTE POR ${state.user.name.toUpperCase()} (${state.user.email}). ACCESO AL CUADERNO DESBLOQUEADO.
                  </div>
                  <button class="btn btn-secondary btn-sm" id="btn-revoke-safety">RENOVAR / REVOCAR FIRMA</button>
                ` : `
                  <div class="grid-2" style="margin-bottom: 16px;">
                    <div class="field">
                      <label>Nombre y Apellidos</label>
                      <input type="text" class="input" id="input-sign-name" value="${state.user.name}" />
                    </div>
                    <div class="field">
                      <label>Correo Electrónico UGR</label>
                      <input type="email" class="input" id="input-sign-email" value="${state.user.email}" />
                    </div>
                  </div>
                  <button class="btn btn-primary btn-lg" id="btn-sign-safety">
                    FIRMAR Y DESBLOQUEAR CUADERNO DE LABORATORIO
                  </button>
                `}
              </div>
            </div>
          `;

        // --------------------------------------------------------------------
        // MÓDULO 01: PROTOCOLOS DETALLADOS DE SÍNTESIS
        // --------------------------------------------------------------------
        case '01':
          return `
            <div class="card">
              <div class="card-kicker">MÓDULO 01 · TÉCNICA EXPERIMENTAL</div>
              <h2 class="card-title">Protocolos Detallados de Síntesis Farmacéutica</h2>
              <p class="card-body" style="margin-bottom: 20px;">
                Procedimientos experimentales para la síntesis de fármacos cardiovasculares y analgésicos con esquemas de reacción 2D vectoriales RDKit MinimalLib.
              </p>

              <div style="display: flex; flex-direction: column; gap: 28px;">
                <!-- Reacción 1: Propranolol -->
                <div style="border: 2px solid var(--color-border); padding: 20px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h3>1. Síntesis de Propranolol (Betabloqueante Adrenérgico)</h3>
                    <span class="tag tag-accent">2 ETAPAS CONSECUTIVAS</span>
                  </div>

                  <!-- Esquema 2D RDKit: Etapa 1 -->
                  <div style="margin: 12px 0;">
                    <div style="font-size: 0.78rem; font-weight: 700; color: var(--color-accent); margin-bottom: 4px;">ETAPA 1: ALQUILACIÓN / APERTURA DE OXIRANO</div>
                    <div class="chem-reaction-container" id="rxn-propranolol-step1" data-rxn="c1ccc2c(c1)cccc2O.C1CC1CCl>>c1ccc2c(c1)cccc2OCC1CO1" data-reagents="NaOH (aq), reflujo 2h">
                      <div class="mono" style="font-size: 0.8rem; color: var(--color-text-muted);">Generando esquema de reacción 2D RDKit...</div>
                    </div>
                  </div>

                  <!-- Esquema 2D RDKit: Etapa 2 -->
                  <div style="margin: 12px 0;">
                    <div style="font-size: 0.78rem; font-weight: 700; color: var(--color-accent); margin-bottom: 4px;">ETAPA 2: AMINÓLISIS NUCLEOFÍLICA (APERTURA REGIOPREDILECTA)</div>
                    <div class="chem-reaction-container" id="rxn-propranolol-step2" data-rxn="c1ccc2c(c1)cccc2OCC1CO1.CC(C)N>>c1ccc2c(c1)cccc2OCC(O)CNC(C)C" data-reagents="i-PrNH2 en exceso, reflujo">
                      <div class="mono" style="font-size: 0.8rem; color: var(--color-text-muted);">Generando esquema de reacción 2D RDKit...</div>
                    </div>
                  </div>

                  <div class="table-container" style="border: none; margin: 8px 0;">
                    <table class="table" style="font-size: 0.85rem;">
                      <tr><th>Paso 1: Apertura de Oxirano</th><td>α-Naftol + Epiclorhidrina + NaOH (aq) ➔ 2-(1-Naftil)oximetiloxirano.</td></tr>
                      <tr><th>Paso 2: Aminólisis Nucleofílica</th><td>Oxirano + Isopropilamina en exceso a reflujo ➔ Propranolol base.</td></tr>
                      <tr><th>Purificación & Caracterización</th><td>Recristalización en etanol/éter. Control por CCF (Hexano/AcOEt 7:3) y p.f. (96 °C).</td></tr>
                      <tr><th>Precauciones Críticas</th><td>La epiclorhidrina es carcinógena y tóxica: pipetear SIEMPRE en vitrina extractora.</td></tr>
                    </table>
                  </div>
                </div>

                <!-- Reacción 2: DHPP / Dihidropiridinas (Hantzsch) -->
                <div style="border: 2px solid var(--color-border); padding: 20px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h3>2. Síntesis de Dihidropiridinas (Reacción Multicomponente de Hantzsch)</h3>
                    <span class="tag tag-neutral">1 ETAPA · REACCIÓN 4-COMPONENTE</span>
                  </div>

                  <!-- Esquema 2D RDKit: Hantzsch -->
                  <div style="margin: 12px 0;">
                    <div class="chem-reaction-container" id="rxn-dhpp-hantzsch" data-rxn="O=Cc1ccccc1.CC(=O)CC(=O)OC.N>>COC(=O)C1=C(C)NC(C)=C(C(=O)OC)C1c2ccccc2" data-reagents="EtOH 96%, reflujo 2h">
                      <div class="mono" style="font-size: 0.8rem; color: var(--color-text-muted);">Generando esquema de reacción multicomponente Hantzsch...</div>
                    </div>
                  </div>

                  <div class="table-container" style="border: none; margin: 8px 0;">
                    <table class="table" style="font-size: 0.85rem;">
                      <tr><th>Reactivos</th><td>Benzaldehído (1 equiv.) + Acetoacetato de metilo (2 equiv.) + Amoníaco concentrado (1.5 equiv.).</td></tr>
                      <tr><th>Procedimiento</th><td>Reflujo durante 2 h en etanol al 96%. Enfriamiento en baño de hielo y filtración a vacío en Büchner.</td></tr>
                      <tr><th>Producto Obtenido</th><td>2,6-Dimetil-4-fenil-1,4-dihidropiridina-3,5-dicarboxilato de dimetilo (DHPP, p.f. 196 °C).</td></tr>
                      <tr><th>Análogo Clínico</th><td>Sustitución con 2-nitrobenzaldehído ➔ Nifedipino (bloqueante de canales de Ca²⁺).</td></tr>
                    </table>
                  </div>
                </div>

                <!-- Reacción 3: Paracetamol -->
                <div style="border: 2px solid var(--color-border); padding: 20px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h3>3. Síntesis de Paracetamol (Acetil-p-aminofenol)</h3>
                    <span class="tag tag-outline">ACILACIÓN REGIOSELECTIVA</span>
                  </div>

                  <!-- Esquema 2D RDKit: Paracetamol -->
                  <div style="margin: 12px 0;">
                    <div class="chem-reaction-container" id="rxn-paracetamol-acylation" data-rxn="Nc1ccc(O)cc1.CC(=O)OC(=O)C>>CC(=O)Nc1ccc(O)cc1" data-reagents="H2O tamponada, 25 °C">
                      <div class="mono" style="font-size: 0.8rem; color: var(--color-text-muted);">Generando esquema de reacción 2D RDKit...</div>
                    </div>
                  </div>

                  <div class="table-container" style="border: none; margin: 8px 0;">
                    <table class="table" style="font-size: 0.85rem;">
                      <tr><th>Reactivos</th><td>4-Aminofenol + Anhídrido acético en medio acuoso tamponado.</td></tr>
                      <tr><th>Quimioselectividad</th><td>Acilación preferente del grupo amino frente al hidroxilo fenólico debido a su mayor nucleofilia.</td></tr>
                      <tr><th>Aislamiento</th><td>Precipitación en medio frío, recristalización en agua y secado en estufa a 60 °C (p.f. 169-171 °C).</td></tr>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          `;

        // --------------------------------------------------------------------
        // MÓDULO 02: CALCULADORA DE RENDIMIENTOS ESTEQUIOMÉTRICA EN VIVO
        // --------------------------------------------------------------------
        case '02':
          // Derivar cálculos en vivo
          const c = state.yieldCalc;
          const molesA = c.mwA > 0 ? c.massA / c.mwA : 0;
          const molesB = c.mwB > 0 ? c.massB / c.mwB : 0;
          const limiting = molesA <= molesB ? 'Reactivo A' : 'Reactivo B';
          const limitingMoles = Math.min(molesA, molesB);
          const theoreticalYieldG = limitingMoles * c.mwProd;
          const percentYield = theoreticalYieldG > 0 ? (c.massProd / theoreticalYieldG) * 100 : 0;

          return `
            <div class="card">
              <div class="card-kicker">MÓDULO 02 · CÁLCULO ESTEQUIOMÉTRICO EN VIVO</div>
              <h2 class="card-title">Calculadora de Reactivo Limitante y Rendimientos</h2>
              <p class="card-body" style="margin-bottom: 16px;">
                Introduce los pesos y masas molares de tus reactivos para calcular el reactivo limitante, la masa teórica esperada y el rendimiento real obtenido.
              </p>

              <!-- Presets Rápidos -->
              <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
                <span style="font-size: 0.82rem; font-weight: 800; align-self: center;">PRESETS:</span>
                <button class="btn btn-secondary btn-sm" id="preset-prop">SÍNTESIS PROPRANOLOL</button>
                <button class="btn btn-secondary btn-sm" id="preset-dhpp">SÍNTESIS DHPP (HANTZSCH)</button>
                <button class="btn btn-secondary btn-sm" id="preset-paracetamol">SÍNTESIS PARACETAMOL</button>
              </div>

              <!-- Formulario de 6 Inputs -->
              <div class="grid-3" style="margin-bottom: 24px;">
                <div class="field">
                  <label>Masa Reactivo A (g)</label>
                  <input type="number" step="0.01" class="input input-mono" id="yield-massA" value="${c.massA}" />
                </div>
                <div class="field">
                  <label>PM Reactivo A (g/mol)</label>
                  <input type="number" step="0.01" class="input input-mono" id="yield-mwA" value="${c.mwA}" />
                </div>
                <div class="field" style="background: var(--color-surface-dim); padding: 10px; border: 1px solid var(--color-border);">
                  <label>Moles Reactivo A</label>
                  <div class="mono" style="font-size: 1.1rem; font-weight: 700;">${molesA.toFixed(4)} mol</div>
                </div>

                <div class="field">
                  <label>Masa Reactivo B (g)</label>
                  <input type="number" step="0.01" class="input input-mono" id="yield-massB" value="${c.massB}" />
                </div>
                <div class="field">
                  <label>PM Reactivo B (g/mol)</label>
                  <input type="number" step="0.01" class="input input-mono" id="yield-mwB" value="${c.mwB}" />
                </div>
                <div class="field" style="background: var(--color-surface-dim); padding: 10px; border: 1px solid var(--color-border);">
                  <label>Moles Reactivo B</label>
                  <div class="mono" style="font-size: 1.1rem; font-weight: 700;">${molesB.toFixed(4)} mol</div>
                </div>

                <div class="field">
                  <label>PM Producto Esperado (g/mol)</label>
                  <input type="number" step="0.01" class="input input-mono" id="yield-mwProd" value="${c.mwProd}" />
                </div>
                <div class="field">
                  <label>Masa Obtenida Real (g)</label>
                  <input type="number" step="0.01" class="input input-mono" id="yield-massProd" value="${c.massProd}" />
                </div>
                <div class="field" style="background: var(--color-surface-dim); padding: 10px; border: 1px solid var(--color-border);">
                  <label>Reactivo Limitante</label>
                  <div style="font-weight: 800; color: var(--color-accent); font-size: 1.1rem;">${limiting}</div>
                </div>
              </div>

              <!-- Resultados en Fila de Métricas -->
              <div class="stat-row" style="margin-bottom: 20px;">
                <div class="stat-col">
                  <div class="stat-value">${theoreticalYieldG.toFixed(3)} g</div>
                  <div class="stat-label">Rendimiento Teórico Esperado</div>
                </div>
                <div class="stat-col">
                  <div class="stat-value">${c.massProd.toFixed(3)} g</div>
                  <div class="stat-label">Masa Real Aislada</div>
                </div>
                <div class="stat-col">
                  <div class="stat-value" style="color: ${percentYield >= 70 ? 'var(--color-success)' : percentYield >= 45 ? 'var(--color-warning)' : 'var(--color-accent)'};">
                    ${percentYield.toFixed(1)} %
                  </div>
                  <div class="stat-label">Rendimiento Real Obtenido</div>
                </div>
              </div>

              <div style="background: var(--color-bg); padding: 16px; border: 1px solid var(--color-border); font-size: 0.9rem;">
                <strong>Diagnóstico de laboratorio:</strong> 
                ${percentYield >= 80 ? 'Excelente rendimiento sintético. Las técnicas de reflujo y aislamiento se han ejecutado con precisión.' : 
                  percentYield >= 50 ? 'Rendimiento estándar aceptable en síntesis orgánica farmacéutica. Se han producido pérdidas menores en lavados o recristalización.' :
                  'Rendimiento bajo (<50%). Se recomienda revisar la temperatura de reflujo, el tiempo de reacción o verificar la pérdida de producto en las aguas madres de cristalización.'}
              </div>
            </div>
          `;

        // --------------------------------------------------------------------
        // MÓDULO 03: CALCULADORA DE DISOLUCIONES (C1V1 = C2V2)
        // --------------------------------------------------------------------
        case '03':
          const sc = state.solutionCalc;
          let calculatedVal = 0;
          let calculatedLabel = '';

          if (sc.target === 'v1') {
            calculatedVal = sc.c1 > 0 ? (sc.c2 * sc.v2) / sc.c1 : 0;
            calculatedLabel = 'Volumen V1 necesario de disolución concentrada (mL)';
          } else if (sc.target === 'c1') {
            calculatedVal = sc.v1 > 0 ? (sc.c2 * sc.v2) / sc.v1 : 0;
            calculatedLabel = 'Concentración C1 inicial requerida (M)';
          } else if (sc.target === 'c2') {
            calculatedVal = sc.v2 > 0 ? (sc.c1 * sc.v1) / sc.v2 : 0;
            calculatedLabel = 'Concentración C2 final obtenida (M)';
          } else {
            calculatedVal = sc.c2 > 0 ? (sc.c1 * sc.v1) / sc.c2 : 0;
            calculatedLabel = 'Volumen V2 final alcanzable (mL)';
          }

          return `
            <div class="card">
              <div class="card-kicker">MÓDULO 03 · REACTIVOS & DILUCIONES</div>
              <h2 class="card-title">Calculadora de Disoluciones (C₁V₁ = C₂V₂)</h2>
              <p class="card-body" style="margin-bottom: 20px;">
                Introduce los 3 valores conocidos para despejar automáticamente la cuarta variable.
              </p>

              <div class="field" style="margin-bottom: 20px;">
                <label>Variable Incógnita a Calcular</label>
                <select class="select" id="sol-target">
                  <option value="v1" ${sc.target === 'v1' ? 'selected' : ''}>Calcular V1 (Volumen inicial de concentrado a pipetear)</option>
                  <option value="c1" ${sc.target === 'c1' ? 'selected' : ''}>Calcular C1 (Concentración inicial requerida)</option>
                  <option value="c2" ${sc.target === 'c2' ? 'selected' : ''}>Calcular C2 (Concentración final resultante)</option>
                  <option value="v2" ${sc.target === 'v2' ? 'selected' : ''}>Calcular V2 (Volumen final a enrasar)</option>
                </select>
              </div>

              <div class="grid-4" style="margin-bottom: 24px;">
                <div class="field">
                  <label>C1: Conc. Inicial (M)</label>
                  <input type="number" step="0.01" class="input input-mono" id="sol-c1" value="${sc.c1}" ${sc.target === 'c1' ? 'disabled' : ''} />
                </div>
                <div class="field">
                  <label>V1: Vol. Inicial (mL)</label>
                  <input type="number" step="0.1" class="input input-mono" id="sol-v1" value="${sc.v1}" ${sc.target === 'v1' ? 'disabled' : ''} />
                </div>
                <div class="field">
                  <label>C2: Conc. Final (M)</label>
                  <input type="number" step="0.01" class="input input-mono" id="sol-c2" value="${sc.c2}" ${sc.target === 'c2' ? 'disabled' : ''} />
                </div>
                <div class="field">
                  <label>V2: Vol. Final (mL)</label>
                  <input type="number" step="0.1" class="input input-mono" id="sol-v2" value="${sc.v2}" ${sc.target === 'v2' ? 'disabled' : ''} />
                </div>
              </div>

              <div class="stat-row">
                <div class="stat-col">
                  <div class="stat-value">${calculatedVal.toFixed(2)}</div>
                  <div class="stat-label">${calculatedLabel}</div>
                </div>
              </div>
            </div>
          `;

        // --------------------------------------------------------------------
        // MÓDULO 04: TALLER DE ESPECTROSCOPIA INTERACTIVO
        // --------------------------------------------------------------------
        case '04':
          return `
            <div class="card">
              <div class="card-kicker">MÓDULO 04 · ELUCIDACIÓN ESTRUCTURAL</div>
              <h2 class="card-title">Taller de Espectroscopia RMN ¹H y EM</h2>
              <p class="card-body" style="margin-bottom: 16px;">
                Asigna los desplazamientos químicos (δ ppm), multiplicidades e integrales a la estructura del fármaco sintetizado.
              </p>

              <!-- Selector de Compuesto -->
              <div style="display: flex; gap: 8px; margin-bottom: 18px;">
                <button class="btn ${state.spectroCompound === 'propranolol' ? 'btn-primary' : 'btn-secondary'} btn-sm" id="btn-spectro-prop">PROPRANOLOL</button>
                <button class="btn ${state.spectroCompound === 'dhpp' ? 'btn-primary' : 'btn-secondary'} btn-sm" id="btn-spectro-dhpp">DHPP (DIHIDROPIRIDINA)</button>
                <button class="btn ${state.spectroCompound === 'paracetamol' ? 'btn-primary' : 'btn-secondary'} btn-sm" id="btn-spectro-para">PARACETAMOL</button>
              </div>

              <!-- Tabla de Asignación Editable -->
              <div class="table-container">
                <table class="table">
                  <thead>
                    <tr><th>δ (ppm)</th><th>Multiplicidad</th><th>Integral</th><th>Asignación Propuesta</th><th>Estado</th></tr>
                  </thead>
                  <tbody>
                    ${state.spectroAssignments.map((row, idx) => `
                      <tr>
                        <td class="mono"><strong>${row.peak}</strong></td>
                        <td class="mono">${row.mult}</td>
                        <td class="mono">${row.integral}</td>
                        <td>
                          <input type="text" class="input" style="padding: 4px 8px; font-size: 0.85rem;" value="${row.proposed}" id="spectro-row-${idx}" />
                        </td>
                        <td>
                          ${row.checked ? (row.correct ? '<span class="tag tag-success">CORRECTO ✓</span>' : '<span class="tag tag-accent">REVISAR ✗</span>') : '<span class="tag tag-outline">PENDIENTE</span>'}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <div style="display: flex; gap: 12px; margin-top: 16px;">
                <button class="btn btn-primary" id="btn-check-spectro">COMPROBAR ASIGNACIONES</button>
                <button class="btn btn-secondary" id="btn-reset-spectro">RESETEAR TABLA</button>
              </div>
            </div>
          `;

        // --------------------------------------------------------------------
        // MÓDULO 05: MATERIAL Y MONTAJES DE LABORATORIO
        // --------------------------------------------------------------------
        case '05':
          const checkedCount = Object.values(state.equipmentChecked).filter(Boolean).length;
          const totalEquip = Math.min(LAB_EQUIPMENT.length, 8);
          return `
            <div class="card">
              <div class="card-kicker">MÓDULO 05 · EQUIPAMIENTO & APARATAJE</div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h2 class="card-title" style="margin: 0;">Checklist de Material y Montajes</h2>
                <span class="tag tag-accent">${checkedCount} / ${totalEquip} VERIFICADOS</span>
              </div>
              <p class="card-body" style="margin-bottom: 20px;">
                Comprueba la disponibilidad y estado del instrumental necesario antes de iniciar la síntesis.
              </p>

              <div class="grid-2">
                ${LAB_EQUIPMENT.slice(0, 8).map((eq, idx) => `
                  <div style="border: 2px solid var(--color-border); padding: 14px; background: ${state.equipmentChecked[eq.id] ? 'var(--color-surface-dim)' : '#ffffff'};">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                      <span class="tag tag-mono">${eq.id}</span>
                      <input type="checkbox" class="equip-checkbox" data-eq-id="${eq.id}" ${state.equipmentChecked[eq.id] ? 'checked' : ''} style="width: 18px; height: 18px; accent-color: var(--color-accent);" />
                    </div>
                    <h4 style="margin-bottom: 4px;">${eq.name}</h4>
                    <p style="font-size: 0.8rem; color: var(--color-text-secondary); line-height: 1.4;">${eq.description || eq.safetyNote || 'Material esencial para la práctica.'}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          `;

        // --------------------------------------------------------------------
        // MÓDULO 06: SIMULADOR DE EXAMEN DE PRÁCTICAS
        // --------------------------------------------------------------------
        case '06':
          const examQuestions = PRACTICE_EXAM_QUESTIONS.slice(0, 5);
          let score = 0;
          if (state.labExamSubmitted) {
            examQuestions.forEach((q, idx) => {
              if (state.labExamAnswers[idx] === q.correctIndex) score++;
            });
          }

          return `
            <div class="card">
              <div class="card-kicker">MÓDULO 06 · AUTOEVALUACIÓN DE TÉCNICAS</div>
              <h2 class="card-title">Simulador de Examen de Laboratorio</h2>
              <p class="card-body" style="margin-bottom: 20px;">
                Batería de 5 preguntas sobre seguridad, cálculos estequiométricos, cromatografía y espectroscopia.
              </p>

              ${state.labExamSubmitted ? `
                <div class="stat-row" style="margin-bottom: 24px;">
                  <div class="stat-col">
                    <div class="stat-value">${score} / ${examQuestions.length}</div>
                    <div class="stat-label">Puntuación Final Obtenida</div>
                  </div>
                  <div class="stat-col">
                    <div class="stat-value" style="color: ${score >= 4 ? 'var(--color-success)' : score >= 3 ? 'var(--color-warning)' : 'var(--color-accent)'};">
                      ${score >= 3 ? 'APTO ✓' : 'NO APTO ✗'}
                    </div>
                    <div class="stat-label">Calificación de Laboratorio</div>
                  </div>
                </div>
              ` : ''}

              <div style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 24px;">
                ${examQuestions.map((q, qIdx) => `

        // --------------------------------------------------------------------

    // ========================================================================

        { name: 'Omeprazol', smiles: 'COc1ccc2[nH]c(S(=O)Cc3ncc(C)c(OC)c3C)nc2c1', role: 'Inhibidor bomba de protones (H⁺/K⁺)' },

        { name: 'Donepezilo', smiles: 'COC1=C(C=C2C(=C1)CC(C2=O)CC3CCN(CC3)CC4=CC=CC=C4)OC', role: 'Inhibidor AChE (Alzheimer)' },
        { name: 'Captopril', smiles: 'C[C@H](CS)C(=O)N1CCC[C@H]1C(=O)O', role: 'Inhibidor de la ECA' },
        { name: 'Enalapril', smiles: 'CCOC(=O)[C@H](CCc1ccccc1)N[C@@H](C)C(=O)N2CCC[C@H]2C(=O)O', role: 'Profármaco IECA' },

              </div>

              <!-- Controles de Dibujo -->
              <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: var(--color-text-secondary);">

                    <option value="2.0" ${lab.bondWidth === 2.0 ? 'selected' : ''}>2.0 px (Estándar Modernist)</option>
                    <option value="2.6" ${lab.bondWidth === 2.6 ? 'selected' : ''}>2.6 px (Grueso)</option>
                  </select>
                </div>
              </div>

              <div style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-text-muted); word-break: break-all; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--color-border-subtle);">

              </div>
            </div>

            <!-- Columna Derecha: Descriptores Biofísicos & Scorecard -->
            <div style="display: flex; flex-direction: column; gap: 16px;">

                <div class="chem-descriptor-grid" id="chem-descriptors-container">

                  </div>

                    <div class="val" id="val-csp3">—</div>
                  </div>
                  <div class="chem-descriptor-tile">
                    <div class="label">Anillos Aromáticos</div>

    // ========================================================================
    // PANTALLA 7: SIMULADOR DE AFINIDAD BIOFÍSICA
    // ========================================================================
    function renderSimuladorScreen() {
      const sim = state.affinitySim;
      const bound = (sim.bmax * sim.ligandConc) / (sim.kd + sim.ligandConc);
      const occupancy = (bound / sim.bmax) * 100;

      return `
        <div class="container">
          <div class="kicker">BIOFÍSICA DE INTERACCIÓN FÁRMACO-RECEPTOR</div>
          <h1 style="margin-bottom: 8px;">Simulador Biofísico de Afinidad</h1>
          <p style="color: var(--color-text-secondary); max-width: 800px; margin-bottom: 24px;">
            Modela la unión en equilibrio según la ley de acción de masas: B = (Bmax · [L]) / (KD + [L]).
          </p>

          <div class="hr"></div>

          <div class="grid-2" style="margin-bottom: 32px;">
            <div class="card">
              <div class="card-kicker">PARÁMETROS EXPERIMENTALES</div>
              <h3 style="margin-bottom: 16px;">Controles de Unión</h3>

              <div class="field">
                <label>Constante de Disociación KD: <span class="mono" style="color: var(--color-accent);">${sim.kd} nM</span></label>
                <input type="range" min="1" max="100" value="${sim.kd}" id="sim-kd" style="width: 100%; accent-color: var(--color-accent);" />
              </div>

              <div class="field">
                <label>Concentración de Ligando [L]: <span class="mono" style="color: var(--color-accent);">${sim.ligandConc} nM</span></label>
                <input type="range" min="1" max="200" value="${sim.ligandConc}" id="sim-conc" style="width: 100%; accent-color: var(--color-accent);" />
              </div>

              <div class="field">
                <label>Capacidad Máxima Bmax: <span class="mono" style="color: var(--color-accent);">${sim.bmax} fmol/mg</span></label>
                <input type="range" min="100" max="2000" step="50" value="${sim.bmax}" id="sim-bmax" style="width: 100%; accent-color: var(--color-accent);" />
              </div>
            </div>

            <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <div class="card-kicker">RESULTADO EN EL EQUILIBRIO</div>
                <h3 style="margin-bottom: 16px;">Ocupación de Receptores</h3>
                
                <div class="stat-row" style="margin-bottom: 18px;">
                  <div class="stat-col">
                    <div class="stat-value">${bound.toFixed(1)}</div>
                    <div class="stat-label">Unión Específica (fmol/mg)</div>
                  </div>
                  <div class="stat-col">
                    <div class="stat-value" style="color: var(--color-success);">${occupancy.toFixed(1)} %</div>
                    <div class="stat-label">Ocupación Relativa (%)</div>
                  </div>
                </div>

                <div style="font-size: 0.88rem; color: var(--color-text-secondary); line-height: 1.5;">
                  Cuando [L] = KD (${sim.kd} nM), la ocupación del receptor es exactamente del 50%. A la concentración actual de ${sim.ligandConc} nM, se alcanza el ${occupancy.toFixed(1)}% del efecto saturante.
                </div>
              </div>

              <div style="height: 12px; background: var(--color-surface-dim); border: 2px solid var(--color-border); margin-top: 20px;">
                <div style="height: 100%; width: ${occupancy}%; background: var(--color-accent);"></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ========================================================================

    function renderActiveModal() {
      switch (state.activeModal) {

        // MODAL 1: BUSCADOR DE FÁRMACOS & GLOBAL (⌘K)
        // --------------------------------------------------------------------
        case 'search':
          const q = (state.modalData || '').toLowerCase().trim();
          let results = [];
          if (q) {
            TOPICS.forEach(t => {
              if (t.drugs) {
                t.drugs.forEach(d => {
                  if (d.name.toLowerCase().includes(q) || (d.role || '').toLowerCase().includes(q) || (d.formula || '').toLowerCase().includes(q)) {
                    results.push({ type: 'Fármaco', title: d.name, subtitle: d.role, topicId: t.id, topicName: t.number });
                  }
                });
              }
              if (t.title.toLowerCase().includes(q) || (t.subtitle || '').toLowerCase().includes(q)) {
                results.push({ type: 'Tema', title: t.title, subtitle: t.subtitle, topicId: t.id, topicName: t.number });
              }
            });
          }

          return `
            <div class="dialog-backdrop" id="modal-backdrop">
              <div class="dialog">
                <div class="dialog-header">
