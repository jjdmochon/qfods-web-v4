<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="glassGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="filtrateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="metalGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="#f8fafc" rx="16"/>
  <rect x="12" y="12" width="576" height="676" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Title Badge -->
  <g transform="translate(30, 28)">
    <rect width="540" height="42" rx="8" fill="#0d9488"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
      MONTAJE 2: FILTRACIÓN A VACÍO (KITASATO + EMBUDO BÜCHNER)
    </text>
  </g>

  <!-- Stand and Clamp (Crucial for safety) -->
  <rect x="60" y="600" width="160" height="18" rx="4" fill="url(#metalGrad2)"/>
  <rect x="85" y="120" width="14" height="490" rx="3" fill="url(#metalGrad2)"/>

  <!-- Clamp holding neck of Kitasato -->
  <g transform="translate(85, 310)">
    <rect x="14" y="0" width="135" height="10" fill="#64748b" rx="2"/>
    <circle cx="14" cy="5" r="10" fill="#334155"/>
    <path d="M 149,5 L 170,-8 M 149,5 L 170,18" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <!-- Label -->
    <rect x="180" y="-12" width="180" height="24" rx="4" fill="#0f172a"/>
    <text x="190" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">
      ¡Sujeción obligatoria con pinza!
    </text>
  </g>

  <!-- Kitasato Flask -->
  <g transform="translate(265, 300)">
    <!-- Liquid Filtrate at bottom -->
    <path d="M -90,260 L 90,260 L 65,160 L -65,160 Z" fill="url(#filtrateGrad)"/>
    <!-- Drops falling -->
    <circle cx="0" cy="80" r="3" fill="#eab308"/>
    <circle cx="0" cy="110" r="3.5" fill="#eab308"/>
    <circle cx="0" cy="140" r="2.5" fill="#eab308"/>

    <!-- Glass Body of Kitasato (heavy wall) -->
    <path d="M -22,0 L -22,40 L -95,265 A 15,15 0 0,0 -80,285 L 80,285 A 15,15 0 0,0 95,265 L 22,40 L 22,0 Z" 
          fill="url(#glassGrad2)" stroke="#0284c7" stroke-width="3"/>

    <!-- Sidearm for vacuum connection -->
    <path d="M 22,25 L 65,25 L 65,15 L 22,15" fill="url(#glassGrad2)" stroke="#0284c7" stroke-width="2.5"/>

    <!-- Heavy Vacuum Tube connected to sidearm -->
    <path d="M 65,20 C 120,20 160,80 180,180" fill="none" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>
    <path d="M 65,20 C 120,20 160,80 180,180" fill="none" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>
    <!-- Vacuum Arrow & Label -->
    <g transform="translate(195, 175)">
      <rect width="130" height="42" rx="6" fill="#991b1b"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">A LÍNEA DE VACÍO</text>
      <text x="10" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#fecaca">(Trompa de agua)</text>
    </g>
  </g>

  <!-- Rubber Guko / Cone Seal -->
  <g transform="translate(265, 275)">
    <polygon points="-24,0 24,0 18,25 -18,25" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <text x="50" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569">
      ← Junta cónica de goma (Guko)
    </text>
  </g>

  <!-- Porcelain Büchner Funnel -->
  <g transform="translate(265, 130)">
    <!-- Stem inside flask -->
    <polygon points="-10,145 10,145 10,170 -10,185" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Funnel Cone -->
    <polygon points="-65,70 65,70 12,145 -12,145" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
    <!-- Funnel Top Cylinder -->
    <rect x="-65" y="0" width="130" height="70" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" rx="3"/>

    <!-- Perforated plate dots -->
    <line x1="-55" y1="65" x2="55" y2="65" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="-40" cy="65" r="2" fill="#64748b"/>
    <circle cx="-20" cy="65" r="2" fill="#64748b"/>
    <circle cx="0" cy="65" r="2" fill="#64748b"/>
    <circle cx="20" cy="65" r="2" fill="#64748b"/>
    <circle cx="40" cy="65" r="2" fill="#64748b"/>

    <!-- Circular Filter Paper Layer -->
    <rect x="-58" y="58" width="116" height="5" fill="#38bdf8" rx="2"/>
    <text x="75" y="63" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">
      ← Papel de filtro circular plano
    </text>

    <!-- Crystal cake (precipitate) -->
    <rect x="-52" y="38" width="104" height="20" rx="3" fill="#eab308"/>
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">
      Torta de Cristales (Sólido)
    </text>
  </g>

  <!-- Precaution Box -->
  <g transform="translate(30, 630)">
    <rect width="540" height="50" rx="6" fill="#fffbeb" stroke="#fde047" stroke-width="1.5"/>
    <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">
      ⚠️ REGLA DE ORO DE DESCONEXIÓN:
    </text>
    <text x="15" y="40" font-family="system-ui, sans-serif" font-size="11.5" fill="#a16207">
      Desconectar la goma de vacío del Kitasato ANTES de cerrar el grifo para evitar que el agua sea absorbida al interior.
    </text>
  </g>
</svg>