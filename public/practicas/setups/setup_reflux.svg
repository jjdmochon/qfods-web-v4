<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.65"/>
      <stop offset="30%" stop-color="#e0f2fe" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#f0f9ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="700" fill="#f8fafc" rx="16"/>
  <rect x="12" y="12" width="576" height="676" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Title Badge -->
  <g transform="translate(30, 28)">
    <rect width="540" height="42" rx="8" fill="#1e3a8a"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
      MONTAJE 1: CALEFACCIÓN A REFLUJO CON AGITACIÓN MAGNÉTICA
    </text>
  </g>

  <!-- Retort Stand Base & Rod -->
  <rect x="60" y="620" width="180" height="18" rx="4" fill="url(#metalGrad)" filter="url(#dropShadow)"/>
  <rect x="85" y="100" width="14" height="520" rx="3" fill="url(#metalGrad)"/>

  <!-- Lab-Jack (Scissors Elevator) -->
  <g transform="translate(190, 520)">
    <!-- Base plate -->
    <rect x="0" y="80" width="170" height="14" rx="3" fill="#64748b"/>
    <!-- Top plate -->
    <rect x="0" y="0" width="170" height="14" rx="3" fill="#64748b"/>
    <!-- Scissor Arms -->
    <line x1="20" y1="10" x2="150" y2="80" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="80" x2="150" y2="10" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="85" cy="45" r="7" fill="#475569"/>
    <!-- Adjustment Knob -->
    <rect x="160" y="38" width="18" height="14" rx="3" fill="#0284c7"/>
    <text x="85" y="108" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">
      Lab-Jack (Soporte elevador regulable)
    </text>
  </g>

  <!-- Heating Magnetic Stirrer -->
  <g transform="translate(185, 450)">
    <rect x="0" y="0" width="180" height="68" rx="8" fill="url(#plateGrad)" filter="url(#dropShadow)"/>
    <rect x="10" y="6" width="160" height="12" rx="3" fill="#f1f5f9"/>
    <!-- Knobs & Screen -->
    <circle cx="35" cy="44" r="12" fill="#0f172a"/>
    <circle cx="35" cy="44" r="7" fill="#64748b"/>
    <circle cx="75" cy="44" r="12" fill="#0f172a"/>
    <circle cx="75" cy="44" r="7" fill="#64748b"/>
    <rect x="105" y="32" width="60" height="24" rx="4" fill="#0f172a"/>
    <text x="135" y="48" font-family="monospace" font-size="11" font-weight="bold" fill="#22c55e" text-anchor="middle">85°C 400rpm</text>
  </g>

  <!-- Clamp on stand holding flask neck -->
  <g transform="translate(85, 360)">
    <rect x="14" y="2" width="140" height="10" fill="#64748b" rx="2"/>
    <circle cx="14" cy="7" r="10" fill="#334155"/>
    <path d="M 154,7 L 175,-5 M 154,7 L 175,19" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Round Bottom Flask -->
  <g transform="translate(275, 410)">
    <!-- Liquid in Flask -->
    <path d="M -42,10 A 46,46 0 0,0 42,10 Q 0,2 0,0 Q 0,2 -42,10 Z" fill="url(#liquidGrad)"/>
    <!-- Stir bar -->
    <rect x="-12" y="28" width="24" height="7" rx="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Boiling bubbles -->
    <circle cx="-15" cy="18" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="5" cy="15" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="18" cy="22" r="2" fill="#ffffff" opacity="0.8"/>
    <!-- Flask Glass Body -->
    <circle cx="0" cy="10" r="48" fill="url(#glassGrad)" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Flask Neck -->
    <rect x="-15" y="-55" width="30" height="30" fill="url(#glassGrad)" stroke="#0284c7" stroke-width="2.5"/>
  </g>

  <!-- Reflux Condenser (Ball / Allihn type) -->
  <g transform="translate(275, 140)">
    <!-- Outer Glass Jacket -->
    <rect x="-24" y="0" width="48" height="215" rx="8" fill="url(#glassGrad)" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Inner Vapor Balls (Allihn) -->
    <circle cx="0" cy="40" r="15" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
    <circle cx="0" cy="80" r="15" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
    <circle cx="0" cy="120" r="15" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
    <circle cx="0" cy="160" r="15" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="215" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Bottom Water IN Olive & Tube -->
    <path d="M 24,185 L 48,185 L 48,195 L 24,195 Z" fill="#0284c7"/>
    <!-- Blue Inflow Hose -->
    <path d="M 48,190 C 80,190 90,240 100,280" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <text x="110" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">
      ENTRADA DE AGUA (Oliva inferior)
    </text>
    <polygon points="50,186 62,190 50,194" fill="#ffffff"/>

    <!-- Top Water OUT Olive & Tube -->
    <path d="M 24,30 L 48,30 L 48,40 L 24,40 Z" fill="#0284c7"/>
    <!-- Blue Outflow Hose -->
    <path d="M 48,35 C 85,35 95,-10 110,-10" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
    <text x="120" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">
      SALIDA AL DESAGÜE (Oliva superior)
    </text>
    <polygon points="62,31 74,35 62,39" fill="#ffffff"/>

    <!-- Open Top Warning Badge -->
    <g transform="translate(-10, -50)">
      <rect x="-110" y="0" width="240" height="32" rx="6" fill="#ef4444"/>
      <text x="10" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
        ¡ABIERTO A LA ATMÓSFERA! (Sin tapón)
      </text>
      <line x1="10" y1="32" x2="10" y2="48" stroke="#ef4444" stroke-width="3" stroke-dasharray="2,2"/>
    </g>
  </g>

  <!-- Critical Safety Callout Box at bottom -->
  <g transform="translate(30, 645)">
    <rect width="540" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="20" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">
      ⚠️ SEGURIDAD CRÍTICA: En caso de embalamiento térmico, bajar el Lab-Jack retira el calor de inmediato.
    </text>
  </g>
</svg>