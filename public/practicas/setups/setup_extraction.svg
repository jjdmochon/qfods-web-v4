<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="aqueousGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="organicDcmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glassExtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="#f8fafc" rx="16"/>
  <rect x="12" y="12" width="576" height="676" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Title Badge -->
  <g transform="translate(30, 28)">
    <rect width="540" height="42" rx="8" fill="#1e3a8a"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">
      MONTAJE 3: EXTRACCIÓN LÍQUIDO-LÍQUIDO CON EMBUDO DE DECANTACIÓN
    </text>
  </g>

  <!-- Support Stand & Ring -->
  <rect x="60" y="600" width="160" height="18" rx="4" fill="#64748b"/>
  <rect x="85" y="110" width="14" height="500" rx="3" fill="#64748b"/>
  <!-- Metallic Ring supporting funnel -->
  <g transform="translate(85, 260)">
    <rect x="14" y="0" width="105" height="10" fill="#475569"/>
    <ellipse cx="160" cy="5" rx="55" ry="12" fill="none" stroke="#334155" stroke-width="8"/>
  </g>

  <!-- Separatory Funnel Body -->
  <g transform="translate(245, 100)">
    <!-- Top Ground Glass Stopper -->
    <g transform="translate(0, 0)">
      <polygon points="-12,0 12,0 8,30 -8,30" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
      <ellipse cx="0" cy="-6" rx="16" ry="7" fill="#64748b"/>
      <text x="35" y="10" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ef4444">
        ¡QUITAR TAPÓN PARA DECANTAR!
      </text>
    </g>

    <!-- Funnel Glass Outline -->
    <!-- Top Neck -->
    <rect x="-14" y="25" width="28" height="25" fill="url(#glassExtGrad)" stroke="#0284c7" stroke-width="2.5"/>
    
    <!-- Pear-shaped body -->
    <!-- Upper bulb: Aqueous Phase -->
    <path d="M -14,50 Q -70,80 -70,160 Q -70,220 -35,270 L 35,270 Q 70,220 70,160 Q 70,80 14,50 Z" 
          fill="url(#aqueousGrad)" stroke="#0284c7" stroke-width="2.5"/>

    <!-- Interface Line -->
    <line x1="-58" y1="210" x2="58" y2="210" stroke="#047857" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Lower bulb: Dense Organic DCM Phase -->
    <path d="M -58,210 Q -40,250 -10,320 L 10,320 Q 40,250 58,210 Z" 
          fill="url(#organicDcmGrad)" stroke="#0284c7" stroke-width="2.5"/>

    <!-- Phase Labels -->
    <!-- Aqueous Top Phase -->
    <g transform="translate(85, 130)">
      <rect width="190" height="34" rx="4" fill="#0284c7"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">FASE ACUOSA (Superior)</text>
      <text x="10" y="28" font-family="system-ui, sans-serif" font-size="10" fill="#e0f2fe">Densidad ≈ 1,00 g/mL (Sales, H₂O)</text>
    </g>

    <!-- Organic DCM Bottom Phase -->
    <g transform="translate(85, 235)">
      <rect width="190" height="34" rx="4" fill="#0d9488"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">FASE ORGÁNICA DCM (Inferior)</text>
      <text x="10" y="28" font-family="system-ui, sans-serif" font-size="10" fill="#ccfbf1">d = 1,33 g/mL (Producto extraído)</text>
    </g>

    <!-- Stopcock (Llave de teflón) -->
    <g transform="translate(0, 340)">
      <rect x="-8" y="-20" width="16" height="20" fill="url(#glassExtGrad)" stroke="#0284c7" stroke-width="2"/>
      <rect x="-24" y="0" width="48" height="14" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <polygon points="18,-6 28,7 18,20" fill="#0f172a"/>
      <rect x="-6" y="14" width="12" height="40" fill="url(#glassExtGrad)" stroke="#0284c7" stroke-width="2"/>
    </g>
  </g>

  <!-- Collection Beaker below -->
  <g transform="translate(245, 500)">
    <!-- Organic liquid collecting -->
    <rect x="-35" y="45" width="70" height="30" rx="3" fill="url(#organicDcmGrad)"/>
    <!-- Beaker -->
    <path d="M -40,0 L -40,75 A 8,8 0 0,0 -32,83 L 32,83 A 8,8 0 0,0 40,75 L 40,0" 
          fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <text x="50" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0d9488">
      Vaso de recogida (Fase Orgánica)
    </text>
  </g>

  <!-- Venting Inset Box (Important for Safety) -->
  <g transform="translate(30, 620)">
    <rect width="540" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#166534">
      🌬️ PROTOCOLO DE VENTEO OBLIGATORIO:
    </text>
    <text x="15" y="40" font-family="system-ui, sans-serif" font-size="11.5" fill="#15803d">
      Invertir el embudo apuntando hacia el fondo de la campana, sujetar el tapón con la palma y abrir la llave para liberar la sobrepresión generada por los vapores volátiles de DCM.
    </text>
  </g>
</svg>