<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="rvBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="waterBathWater" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="#f8fafc" rx="16"/>
  <rect x="12" y="12" width="576" height="676" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Title Badge -->
  <g transform="translate(30, 28)">
    <rect width="540" height="42" rx="8" fill="#0d9488"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">
      MONTAJE 4: EVAPORADOR ROTATORIO (ROTAVAPOR) AL VACÍO
    </text>
  </g>

  <!-- Main Motor Body & Stand -->
  <rect x="220" y="180" width="90" height="260" rx="12" fill="url(#rvBodyGrad)"/>
  <circle cx="265" cy="240" r="16" fill="#38bdf8"/>
  <text x="265" y="244" font-family="monospace" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">RPM</text>

  <!-- Water Heating Bath -->
  <g transform="translate(340, 430)">
    <rect x="-10" y="0" width="160" height="85" rx="8" fill="url(#bathGrad)"/>
    <rect x="0" y="10" width="140" height="65" rx="6" fill="url(#waterBathWater)"/>
    <text x="70" y="55" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      35°C - 45°C
    </text>
    <text x="70" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      Baño Termostático de Agua
    </text>
  </g>

  <!-- Rotating Evaporating Flask at 45 deg angle -->
  <g transform="translate(350, 370) rotate(45)">
    <!-- Flask Body inside bath -->
    <circle cx="0" cy="65" r="42" fill="#bae6fd" fill-opacity="0.6" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M -30,65 A 35,35 0 0,0 30,65 Z" fill="#0d9488" fill-opacity="0.8"/>
    <rect x="-14" y="0" width="28" height="35" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <!-- Keck Clip (Green Plastic Clip) -->
    <rect x="-18" y="18" width="36" height="12" rx="3" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  </g>
  <text x="440" y="345" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#15803d">
    ← Clip Keck de seguridad
  </text>
  <text x="440" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">
    Matraz de evaporación giratorio
  </text>

  <!-- Spiral Condenser Glass Column -->
  <g transform="translate(140, 100)">
    <!-- Glass outer column -->
    <rect x="-35" y="0" width="70" height="280" rx="14" fill="#e0f2fe" fill-opacity="0.5" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Spiral Glass Coil inside -->
    <path d="M -18,30 Q 18,45 -18,60 Q 18,75 -18,90 Q 18,105 -18,120 Q 18,135 -18,150 Q 18,165 -18,180 Q 18,195 -18,210 Q 18,225 -18,240" 
          fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Vacuum Connection at Top with Valve -->
    <g transform="translate(0, -30)">
      <rect x="-10" y="0" width="20" height="30" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
      <circle cx="0" cy="-8" r="8" fill="#ef4444"/>
      <text x="25" y="12" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">
        Llave de Ruptura de Vacío
      </text>
    </g>

    <!-- Receiving Flask at Bottom with clamp -->
    <g transform="translate(0, 310)">
      <circle cx="0" cy="40" r="42" fill="#bae6fd" fill-opacity="0.6" stroke="#0284c7" stroke-width="2.5"/>
      <path d="M -30,45 A 35,35 0 0,0 30,45 Z" fill="#38bdf8" fill-opacity="0.8"/>
      <rect x="-12" y="-30" width="24" height="35" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="-90" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">
        Matraz de Recogida de Disolvente
      </text>
    </g>
  </g>

  <!-- Safety Operating Sequence Box -->
  <g transform="translate(30, 620)">
    <rect width="540" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">
      🔄 SECUENCIA DE PARADA OBLIGATORIA:
    </text>
    <text x="15" y="40" font-family="system-ui, sans-serif" font-size="11.5" fill="#1e3a8a">
      1º Subir el matraz del baño térmico → 2º Romper el vacío abriendo la llave superior → 3º Apagar la rotación del motor → 4º Retirar el matraz con el clip Keck.
    </text>
  </g>
</svg>